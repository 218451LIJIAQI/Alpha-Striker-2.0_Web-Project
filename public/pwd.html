<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Security | CineTix Box Office</title>
  <link rel="stylesheet" href="css/common/header.css">
  <link rel="stylesheet" href="css/login/login.css">
  <script src="js/common.js"></script>
  <script src="js/login/pwd.js" defer></script>
</head>
<body>
  <div class="auth-topbar">
    <a href="login.html" class="auth-back-link">&larr; Back to Sign In</a>
    <button type="button" class="dark-mode-toggle" data-theme-toggle title="Toggle Dark Mode" aria-label="Toggle Dark Mode"></button>
  </div>

  <main id="login-page" class="auth-shell">
    <div class="container">
      <div class="logo-section">
        <a href="pages/homepage.html" class="logo-brand-link">
          <img src="img/logo.jpg" alt="CineTix Logo">
          <span>CineTix</span>
        </a>
        <p>Account Security &amp; Verification</p>
      </div>

      <div class="auth-container card">
        <div class="auth-header">
          <h1>Password Security</h1>
          <p>Reset via email verification code or update using your current password</p>
        </div>

        <div class="auth-tabs" role="tablist" aria-label="Password Update Mode">
          <button type="button" id="tab-reset-code" class="auth-tab-btn active" role="tab" aria-selected="true">Email Verification</button>
          <button type="button" id="tab-old-pwd" class="auth-tab-btn" role="tab" aria-selected="false">Current Password</button>
        </div>

        <form id="reset-form">
          <div class="form-group">
            <label for="email" class="form-label">Email Address *</label>
            <input type="email" id="email" class="form-input" placeholder="Enter your registered email" required maxlength="100" autocomplete="email">
          </div>

          <div class="form-group">
            <label for="Verification" class="form-label">6-Digit Verification Code *</label>
            <div class="verification-input">
              <input type="text" id="Verification" class="form-input tabular-nums" placeholder="Enter 6-digit code" required maxlength="6" inputmode="numeric" pattern="\d{6}" autocomplete="one-time-code">
              <button type="button" id="send-code" class="send-code-btn">Send Code</button>
            </div>
          </div>

          <div class="form-group">
            <label for="password" class="form-label">New Password *</label>
            <input type="password" id="password" class="form-input" placeholder="6 to 72 UTF-8 bytes" required minlength="6" maxlength="72" autocomplete="new-password">
          </div>

          <button type="submit" class="btn btn-primary">Reset Password</button>
        </form>

        <form id="change-pwd-form" class="is-hidden">
          <div class="form-group">
            <label for="old-password" class="form-label">Current Password *</label>
            <input type="password" id="old-password" class="form-input" placeholder="Enter your current password" required maxlength="72" autocomplete="current-password">
          </div>

          <div class="form-group">
            <label for="new-password-auth" class="form-label">New Password *</label>
            <input type="password" id="new-password-auth" class="form-input" placeholder="6 to 72 UTF-8 bytes" required minlength="6" maxlength="72" autocomplete="new-password">
          </div>

          <div class="form-group">
            <label for="confirm-password-auth" class="form-label">Confirm New Password *</label>
            <input type="password" id="confirm-password-auth" class="form-input" placeholder="Re-enter new password" required minlength="6" maxlength="72" autocomplete="new-password">
          </div>

          <button type="submit" class="btn btn-primary">Update Password</button>
        </form>

        <div class="auth-footer">
          <p><a href="login.html" class="auth-link">Back to Sign In</a> &bull; <a href="pages/homepage.html" class="auth-link">Browse Movies</a></p>
        </div>
      </div>

      <div class="copyright">
        <p>&copy; 2026 Alpha Striker 2.0 (CineTix). All rights reserved.</p>
      </div>
    </div>
  </main>
</body>
</html>
