<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | Alpha Striker 2.0</title>
  <link rel="stylesheet" href="css/common/header.css">
  <link rel="stylesheet" href="css/login/login.css">
  <script src="js/common.js"></script>
  <script src="js/login/pwd.js" defer></script>
</head>
<body>
  <div id="login-page" style="display:block;">
    <div class="container">
      <div class="logo-section">
        <a href="pages/homepage.html"><img src="img/logo.jpg" alt="CineTix Logo"></a>
        <p>Your Ultimate Movie Experience</p>
      </div>

      <div class="auth-container card">
        <div class="auth-header">
          <h1 id="pwd-heading">Reset Password</h1>
          <p id="pwd-subheading">Request a one-time verification code for your registered email</p>
        </div>

        <div id="pwd-mode-switch" style="display:none; margin-bottom:16px; text-align:center;">
          <button type="button" id="toggle-pwd-mode" class="auth-link" style="background:none; border:none; cursor:pointer; font-size:14px;">
            Switch to Current-Password Verification
          </button>
        </div>

        <div id="demo-otp-banner" role="status" style="display:none; margin-bottom:15px; padding:10px 14px; border-radius:8px; background:#eff6ff; border:1px solid #bfdbfe; color:#1e40af; font-size:13px;"></div>

        <form id="reset-form" onsubmit="resetPwd(event)">
          <div class="form-group">
            <label for="email" class="form-label">Email</label>
            <input type="email" id="email" class="form-input" placeholder="Enter your registered email" required autocomplete="email">
          </div>

          <div class="form-group" id="otp-group">
            <label for="Verification" class="form-label">One-Time Verification Code</label>
            <div class="verification-input">
              <input type="text" id="Verification" class="form-input" placeholder="6-digit code" inputmode="numeric" maxlength="10">
              <button type="button" id="send-code" class="send-code-btn">Send Code</button>
            </div>
          </div>

          <div class="form-group" id="current-pwd-group" style="display:none;">
            <label for="current-password" class="form-label">Current Password</label>
            <input type="password" id="current-password" class="form-input" placeholder="Enter your current password" autocomplete="current-password">
          </div>

          <div class="form-group">
            <label for="password" class="form-label">New Password</label>
            <input type="password" id="password" class="form-input" placeholder="At least 6 characters" required minlength="6" autocomplete="new-password">
          </div>

          <button type="submit" class="btn btn-primary" id="pwd-submit-btn">Reset Password</button>
        </form>

        <div class="auth-footer">
          <p><a href="login.html" class="auth-link">Back to Sign In</a> &bull; <a href="pages/homepage.html" class="auth-link">Browse Movies</a></p>
        </div>
      </div>

      <div class="copyright">
        <p>&copy; 2026 Alpha Striker 2.0 (CineTix). All rights reserved.</p>
      </div>
    </div>
  </div>
</body>
</html>
