<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Auditorium Preview | CineTix Box Office</title>
  <meta name="description" content="Interactive 3D cinema auditorium sightline and seating simulator.">
  <link rel="icon" href="../favicon.ico">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      overflow: hidden;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: radial-gradient(circle at 50% 20%, #241224 0%, #10182b 48%, #070a11 100%);
      color: #f1f5f9;
      user-select: none;
    }

    #viewer {
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .top-bar {
      position: absolute;
      top: 16px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      z-index: 30;
      pointer-events: none;
    }

    .top-bar > * { pointer-events: auto; }

    .hud-btn {
      padding: 8px 15px;
      background: rgba(15, 23, 42, 0.9);
      color: #f8fafc;
      border: 1px solid rgba(148, 163, 184, 0.36);
      border-radius: 999px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      transition: background-color 0.18s ease, border-color 0.18s ease, transform 0.18s ease;
    }

    .hud-btn:hover,
    .hud-btn.active {
      background: #be123c;
      border-color: #fbbf24;
    }

    .hud-btn:focus-visible,
    .seat-3d:focus-visible,
    input[type="range"]:focus-visible {
      outline: 2px solid #fbbf24;
      outline-offset: 2px;
    }

    .hud-btn.primary-cta {
      background: #15803d;
      border-color: #22c55e;
      color: #ffffff;
    }

    .hud-btn.primary-cta:hover:not(:disabled) {
      background: #166534;
    }

    .hud-btn.primary-cta:disabled {
      background: #475569;
      border-color: #64748b;
      cursor: not-allowed;
      opacity: 0.85;
    }

    .preset-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* CSS-3D Auditorium Stage */
    #auditorium-3d-stage {
      width: 100%;
      height: 100%;
      perspective: 1100px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
      overflow: hidden;
    }

    #auditorium-3d-stage:active { cursor: grabbing; }

    #auditorium-3d-room {
      position: relative;
      width: 720px;
      height: 540px;
      transform-style: preserve-3d;
      transition: transform 0.14s ease-out;
    }

    .screen-3d {
      position: absolute;
      top: 4px;
      left: 50%;
      width: 560px;
      height: 124px;
      transform: translateX(-50%) translateZ(-135px) rotateX(-6deg);
      background: linear-gradient(180deg, #fffbeb 0%, #fde68a 38%, #93c5fd 100%);
      border-radius: 14px 14px 44% 44% / 10px 10px 22px 22px;
      box-shadow: 0 0 65px rgba(251, 191, 36, 0.36), 0 28px 60px rgba(37, 99, 235, 0.32);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #0f172a;
      border: 2px solid rgba(255, 255, 255, 0.9);
    }

    .screen-3d-title {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 2.8px;
    }

    .screen-3d-sub {
      font-size: 12px;
      font-weight: 600;
      color: #0f172a;
      margin-top: 4px;
    }

    .floor-3d {
      position: absolute;
      top: 146px;
      left: 50%;
      width: 680px;
      height: 392px;
      transform: translateX(-50%) rotateX(34deg);
      transform-style: preserve-3d;
      background: linear-gradient(180deg, rgba(30, 41, 59, 0.92) 0%, rgba(15, 23, 42, 0.98) 100%);
      border: 1px solid rgba(251, 191, 36, 0.28);
      border-radius: 18px;
      padding: 24px 26px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.68);
    }

    .row-3d {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transform-style: preserve-3d;
    }

    .row-tag-3d {
      width: 18px;
      font-size: 11px;
      font-weight: 700;
      color: #e2e8f0;
      text-align: center;
    }

    .seat-3d {
      width: 34px;
      height: 28px;
      border-radius: 6px 6px 10px 10px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: #334155;
      color: #f8fafc;
      font-size: 9.5px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transform: translateZ(10px);
      transition: transform 0.16s ease, background-color 0.16s ease, box-shadow 0.16s ease;
    }

    .seat-3d.vip-3d {
      background: #78350f;
      border-color: #f59e0b;
      color: #fef3c7;
    }

    .seat-3d.reserved-3d {
      background: #7f1d1d;
      border-color: #ef4444;
      color: #fecaca;
      opacity: 0.8;
    }

    .seat-3d:hover {
      transform: translateZ(20px) scale(1.12);
      background: #fbbf24;
      color: #0f172a;
    }

    .seat-3d.active-pov {
      background: #15803d;
      border-color: #bbf7d0;
      color: #ffffff;
      transform: translateZ(24px) scale(1.16);
      box-shadow: 0 0 18px rgba(34, 197, 94, 0.75);
    }

    .aisle-gap { margin-right: 13px; }

    /* Bottom Telemetry & Controls */
    .bottom-hud {
      position: absolute;
      bottom: 16px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 14px;
      flex-wrap: wrap;
      z-index: 30;
      pointer-events: none;
    }

    .bottom-hud > * { pointer-events: auto; }

    #infoBox {
      background: rgba(15, 23, 42, 0.94);
      border: 1px solid rgba(148, 163, 184, 0.3);
      color: #e2e8f0;
      padding: 13px 16px;
      border-radius: 14px;
      max-width: 440px;
      font-size: 13px;
      line-height: 1.45;
    }

    .info-heading {
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .telemetry-badges {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .telemetry-pill {
      padding: 3px 10px;
      border-radius: 999px;
      background: rgba(190, 18, 60, 0.28);
      border: 1px solid rgba(251, 191, 36, 0.48);
      color: #fef3c7;
      font-size: 12px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .controls-panel {
      background: rgba(15, 23, 42, 0.94);
      border: 1px solid rgba(148, 163, 184, 0.3);
      padding: 11px 15px;
      border-radius: 14px;
      display: flex;
      gap: 14px;
      align-items: center;
      flex-wrap: wrap;
    }

    .slider-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 12px;
      color: #e2e8f0;
    }

    .slider-group input[type="range"] {
      width: 100px;
      accent-color: #f59e0b;
    }

    #external-frame-wrap {
      position: absolute;
      inset: 0;
      z-index: 25;
      background: #090c12;
      display: none;
    }

    #external-frame-wrap.active { display: block; }
    #external-frame-wrap iframe { width: 100%; height: 100%; border: none; }

    @media (max-height: 620px), (max-width: 900px) {
      #auditorium-3d-stage { padding-bottom: 16px; }
      .top-bar { top: 6px; left: 10px; right: 10px; gap: 5px; }
      .bottom-hud { bottom: 6px; left: 10px; right: 10px; gap: 8px; }
      .hud-btn { padding: 4px 9px; font-size: 11px; }
      #infoBox { padding: 6px 10px; font-size: 11px; max-width: 56%; }
      .info-heading { font-size: 12px; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      #infoBox .hud-hint { display: none; }
      .telemetry-badges { margin-top: 3px; gap: 4px; }
      .telemetry-pill { padding: 1px 7px; font-size: 10.5px; }
      .controls-panel { padding: 6px 9px; gap: 7px; }
      .slider-group { font-size: 10.5px; gap: 2px; }
      .slider-group input[type="range"] { width: 64px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition: none !important;
        animation: none !important;
      }
    }
  </style>
</head>
<body>
  <main id="viewer">
    <div class="top-bar">
      <div class="preset-group">
        <button type="button" id="backBtn" class="hud-btn" aria-label="Return to seat selection">&larr; Back to Booking</button>
        <button type="button" id="book-pov-seat-btn" class="hud-btn primary-cta">Reserve Seat D6</button>
      </div>
      <div class="preset-group" role="group" aria-label="Camera Presets">
        <button type="button" class="hud-btn cam-preset active" data-seat="D6" data-yaw="0" data-pitch="18" data-zoom="100" aria-pressed="true">Prime VIP (D6)</button>
        <button type="button" class="hud-btn cam-preset" data-seat="A6" data-yaw="0" data-pitch="10" data-zoom="110" aria-pressed="false">Front Row (A6)</button>
        <button type="button" class="hud-btn cam-preset" data-seat="H6" data-yaw="0" data-pitch="28" data-zoom="94" aria-pressed="false">Balcony (H6)</button>
        <button type="button" class="hud-btn cam-preset" data-seat="E7" data-yaw="-20" data-pitch="30" data-zoom="92" aria-pressed="false">Isometric Overview</button>
        <button type="button" id="toggle-sketchfab-btn" class="hud-btn" aria-pressed="false">External 3D Mesh</button>
      </div>
    </div>

    <div id="auditorium-3d-stage" aria-label="Interactive CSS 3D Auditorium">
      <div id="auditorium-3d-room">
        <div class="screen-3d">
          <div class="screen-3d-title">4K RGB LASER &bull; DOLBY ATMOS</div>
          <div class="screen-3d-sub" id="screen-sightline-caption">Viewing from D6 — 36° THX Prime Sightline</div>
        </div>
        <div class="floor-3d" id="seats-3d-floor" role="group" aria-label="3D Auditorium Seats A1 to H12"></div>
      </div>
    </div>

    <div id="external-frame-wrap"></div>

    <div class="bottom-hud">
      <div id="infoBox">
        <div class="info-heading" id="hall-heading">Auditorium Hall A — 3D Sightline Simulator</div>
        <div class="hud-hint">Drag to orbit, use arrow keys, press Esc to exit, or click any seat (A1–H12) to inspect screen elevation and acoustic balance.</div>
        <div class="telemetry-badges">
          <span class="telemetry-pill" id="pov-seat-label">Seat: D6</span>
          <span class="telemetry-pill" id="pov-angle-label">Angle: 36° THX Optimal</span>
          <span class="telemetry-pill" id="pov-zone-label">Zone: Prime VIP</span>
        </div>
      </div>

      <div class="controls-panel">
        <label class="slider-group">
          <span>Pan (Yaw)</span>
          <input type="range" id="yaw-slider" min="-45" max="45" value="0">
        </label>
        <label class="slider-group">
          <span>Tilt (Pitch)</span>
          <input type="range" id="pitch-slider" min="6" max="46" value="18">
        </label>
        <label class="slider-group">
          <span>Zoom</span>
          <input type="range" id="zoom-slider" min="75" max="125" value="100">
        </label>
      </div>
    </div>
  </main>

  <script>
    (function () {
      'use strict';

      const ROWS = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'];
      const VIP_ROWS = new Set(['D', 'E']);
      const ROW_ANGLES = { A: '54° Close', B: '47° Immersive', C: '41° Wide', D: '36° THX Optimal', E: '34° THX Optimal', F: '30° Balanced', G: '27° Elevated', H: '24° Panoramic' };

      const params = new URLSearchParams(window.location.search);
      const rawMovie = (params.get('movie_code') || '').trim();
      const rawTheater = (params.get('theater_code') || '').trim();
      const movieCode = /^[1-9]\d*$/.test(rawMovie) ? rawMovie : '1';
      const theaterCode = /^[1-9]\d*$/.test(rawTheater) ? rawTheater : '1';
      const rawDate = (params.get('date') || '').trim();
      const dateParam = /^\d{4}-\d{2}-\d{2}$/.test(rawDate) ? rawDate : '';
      const timeParam = (params.get('time') || '').trim();
      const priorSeats = (params.get('seats') || '')
        .split(',')
        .map(function (s) { return s.trim().toUpperCase(); })
        .filter(function (s) { return /^[A-H](?:[1-9]|1[0-2])$/.test(s); });

      let activeSeat = (params.get('seat') || priorSeats[0] || 'D6').toUpperCase();
      if (!/^[A-H](?:[1-9]|1[0-2])$/.test(activeSeat)) activeSeat = 'D6';

      const occupiedSet = new Set();
      let yaw = 0;
      let pitch = 18;
      let zoom = 100;
      let dragging = false;
      let lastX = 0;
      let lastY = 0;
      let externalActive = false;

      const room = document.getElementById('auditorium-3d-room');
      const stage = document.getElementById('auditorium-3d-stage');
      const floor = document.getElementById('seats-3d-floor');
      const yawSlider = document.getElementById('yaw-slider');
      const pitchSlider = document.getElementById('pitch-slider');
      const zoomSlider = document.getElementById('zoom-slider');
      const bookBtn = document.getElementById('book-pov-seat-btn');
      const captionEl = document.getElementById('screen-sightline-caption');
      const headingEl = document.getElementById('hall-heading');
      const seatLabel = document.getElementById('pov-seat-label');
      const angleLabel = document.getElementById('pov-angle-label');
      const zoneLabel = document.getElementById('pov-zone-label');
      const extWrap = document.getElementById('external-frame-wrap');
      const toggleExtBtn = document.getElementById('toggle-sketchfab-btn');

      ROWS.forEach(function (r, rowIdx) {
        const rowEl = document.createElement('div');
        rowEl.className = 'row-3d';
        rowEl.style.transform = 'translateZ(' + (rowIdx * 6) + 'px)';

        const tag = document.createElement('span');
        tag.className = 'row-tag-3d';
        tag.textContent = r;
        tag.setAttribute('aria-hidden', 'true');
        rowEl.appendChild(tag);

        for (let n = 1; n <= 12; n++) {
          const code = r + n;
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'seat-3d' +
            (VIP_ROWS.has(r) ? ' vip-3d' : '') +
            (n === 3 || n === 9 ? ' aisle-gap' : '') +
            (code === activeSeat ? ' active-pov' : '');
          btn.dataset.seat = code;
          btn.textContent = code;
          btn.setAttribute('aria-pressed', String(code === activeSeat));
          btn.setAttribute('aria-label', 'Inspect sightline from seat ' + code + (VIP_ROWS.has(r) ? ', Prime VIP' : ''));
          btn.addEventListener('click', function (e) {
            e.stopPropagation();
            selectPovSeat(code);
          });
          rowEl.appendChild(btn);
        }
        floor.appendChild(rowEl);
      });

      function closeExternalMesh() {
        externalActive = false;
        extWrap.classList.remove('active');
        extWrap.innerHTML = '';
        toggleExtBtn.textContent = 'External 3D Mesh';
        toggleExtBtn.setAttribute('aria-pressed', 'false');
      }

      function computeViewportFit() {
        if (window.innerWidth < 240 || window.innerHeight < 240) return 1;
        const wFit = (window.innerWidth - 28) / 740;
        const hReserve = window.innerHeight <= 620 ? 156 : 180;
        const hFit = (window.innerHeight - hReserve) / 540;
        return Math.max(0.34, Math.min(1, wFit, hFit));
      }

      function applyTransform() {
        const scale = ((zoom / 100) * computeViewportFit()).toFixed(2);
        room.style.transform = 'scale(' + scale + ') rotateX(' + pitch + 'deg) rotateY(' + yaw + 'deg)';
        yawSlider.value = String(Math.round(yaw));
        pitchSlider.value = String(Math.round(pitch));
        zoomSlider.value = String(Math.round(zoom));
      }

      function selectPovSeat(code) {
        activeSeat = code;
        const row = code.charAt(0);
        const col = parseInt(code.slice(1), 10);
        const rowIndex = ROWS.indexOf(row);
        const isReserved = occupiedSet.has(code);

        floor.querySelectorAll('.seat-3d').forEach(function (el) {
          const match = el.dataset.seat === code;
          el.classList.toggle('active-pov', match);
          el.setAttribute('aria-pressed', String(match));
        });

        yaw = Math.round((6.5 - col) * 2.8);
        pitch = Math.round(10 + rowIndex * 2.5);
        zoom = 108 - rowIndex * 2;
        applyTransform();

        const angleDesc = ROW_ANGLES[row] || '35° Balanced';
        const zoneDesc = VIP_ROWS.has(row) ? 'Prime VIP Acoustic' : 'Standard Stadium';
        captionEl.textContent = 'Viewing from ' + code + ' — ' + angleDesc + (isReserved ? ' (Occupied)' : '');
        seatLabel.textContent = 'Seat: ' + code + (isReserved ? ' (Booked)' : '');
        angleLabel.textContent = 'Angle: ' + angleDesc;
        zoneLabel.textContent = 'Zone: ' + zoneDesc;
        bookBtn.disabled = isReserved;
        bookBtn.textContent = isReserved ? ('Seat ' + code + ' Unavailable') : ('Reserve Seat ' + code);
      }

      async function syncContextAndSeats() {
        try {
          const tasks = [
            fetch('/index.php/movie/movies/getMovieByCode?movie_code=' + encodeURIComponent(movieCode), { credentials: 'same-origin' }).then(function (r) { return r.json(); }),
            fetch('/index.php/theater/theater/getTheaterDetails?theater_code=' + encodeURIComponent(theaterCode), { credentials: 'same-origin' }).then(function (r) { return r.json(); }),
          ];
          if (dateParam && timeParam) {
            const q = new URLSearchParams({
              movie_code: movieCode,
              theater_code: theaterCode,
              date: dateParam,
              time: timeParam,
            });
            tasks.push(fetch('/index.php/movie/seat/getSeatList?' + q.toString(), { credentials: 'same-origin' }).then(function (r) { return r.json(); }));
          }
          const results = await Promise.all(tasks);
          const movieRes = results[0];
          const theaterRes = results[1];
          const seatRes = results[2];

          const mTitle = movieRes && movieRes.success && movieRes.data ? movieRes.data.movie_name : '';
          const tTitle = theaterRes && theaterRes.success && theaterRes.data ? theaterRes.data.theater_name : '';
          if (mTitle && tTitle) {
            headingEl.textContent = mTitle + ' @ ' + tTitle + ' — 3D Sightlines';
          } else if (mTitle || tTitle) {
            headingEl.textContent = (mTitle || tTitle) + ' — 3D Sightline Simulator';
          }

          if (seatRes && seatRes.success && Array.isArray(seatRes.data)) {
            seatRes.data.forEach(function (s) {
              const c = String(s.seat_num || '').toUpperCase();
              occupiedSet.add(c);
              const el = floor.querySelector('.seat-3d[data-seat="' + c + '"]');
              if (el) el.classList.add('reserved-3d');
            });
            selectPovSeat(activeSeat);
          }
        } catch (_) {
          // Offline sightline preview continues without network error
        }
      }

      function buildReturnParams(includeActiveSeat) {
        const dest = new URLSearchParams({
          movie_code: movieCode,
          theater_code: theaterCode,
        });
        if (dateParam) dest.set('date', dateParam);
        if (timeParam) dest.set('time', timeParam);
        const merged = priorSeats.slice();
        if (includeActiveSeat && !occupiedSet.has(activeSeat) && merged.indexOf(activeSeat) === -1) {
          if (merged.length < 10) merged.push(activeSeat);
          else merged[merged.length - 1] = activeSeat;
        }
        if (merged.length) {
          dest.set('seats', merged.join(','));
        }
        return dest.toString();
      }

      stage.addEventListener('pointerdown', function (e) {
        if (e.target.closest('.seat-3d')) return;
        dragging = true;
        lastX = e.clientX;
        lastY = e.clientY;
      });
      window.addEventListener('pointermove', function (e) {
        if (!dragging) return;
        const dx = e.clientX - lastX;
        const dy = e.clientY - lastY;
        lastX = e.clientX;
        lastY = e.clientY;
        yaw = Math.max(-45, Math.min(45, yaw + dx * 0.25));
        pitch = Math.max(6, Math.min(46, pitch - dy * 0.2));
        applyTransform();
      });
      window.addEventListener('pointerup', function () { dragging = false; });
      window.addEventListener('resize', applyTransform);

      window.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') {
          e.preventDefault();
          if (externalActive) {
            closeExternalMesh();
          } else {
            window.location.href = 'booking3.html?' + buildReturnParams(false);
          }
          return;
        }
        if (e.target && e.target.tagName === 'INPUT') return;
        const rIdx = ROWS.indexOf(activeSeat.charAt(0));
        const col = parseInt(activeSeat.slice(1), 10);
        let nextRow = rIdx;
        let nextCol = col;
        if (e.key === 'ArrowRight') nextCol = Math.min(12, col + 1);
        else if (e.key === 'ArrowLeft') nextCol = Math.max(1, col - 1);
        else if (e.key === 'ArrowDown') nextRow = Math.min(ROWS.length - 1, rIdx + 1);
        else if (e.key === 'ArrowUp') nextRow = Math.max(0, rIdx - 1);
        else return;

        e.preventDefault();
        const nextCode = ROWS[nextRow] + nextCol;
        selectPovSeat(nextCode);
        floor.querySelector('.seat-3d[data-seat="' + nextCode + '"]')?.focus();
      });

      yawSlider.addEventListener('input', function () { yaw = Number(yawSlider.value); applyTransform(); });
      pitchSlider.addEventListener('input', function () { pitch = Number(pitchSlider.value); applyTransform(); });
      zoomSlider.addEventListener('input', function () { zoom = Number(zoomSlider.value); applyTransform(); });

      document.querySelectorAll('.cam-preset').forEach(function (btn) {
        btn.addEventListener('click', function () {
          document.querySelectorAll('.cam-preset').forEach(function (b) {
            b.classList.remove('active');
            b.setAttribute('aria-pressed', 'false');
          });
          btn.classList.add('active');
          btn.setAttribute('aria-pressed', 'true');
          if (externalActive) closeExternalMesh();
          selectPovSeat(btn.dataset.seat || 'D6');
          yaw = Number(btn.dataset.yaw || 0);
          pitch = Number(btn.dataset.pitch || 24);
          zoom = Number(btn.dataset.zoom || 100);
          applyTransform();
        });
      });

      toggleExtBtn.addEventListener('click', function () {
        if (externalActive) {
          closeExternalMesh();
          return;
        }
        if (!navigator.onLine) {
          captionEl.textContent = 'Offline mode active — using built-in interactive CSS-3D Auditorium';
          return;
        }
        externalActive = true;
        extWrap.classList.add('active');
        extWrap.innerHTML = '<iframe title="External Sketchfab Auditorium" src="https://sketchfab.com/models/dcaf6cdebcad4f03879c24186da257ee/embed?autostart=1&ui_infos=0&ui_controls=1&ui_hint=0" allow="autoplay; fullscreen; xr-spatial-tracking" allowfullscreen></iframe>';
        toggleExtBtn.textContent = 'Built-In 3D View';
        toggleExtBtn.setAttribute('aria-pressed', 'true');
      });

      document.getElementById('backBtn').addEventListener('click', function () {
        window.location.href = 'booking3.html?' + buildReturnParams(false);
      });

      bookBtn.addEventListener('click', function () {
        if (occupiedSet.has(activeSeat)) return;
        window.location.href = 'booking3.html?' + buildReturnParams(true);
      });

      selectPovSeat(activeSeat);
      syncContextAndSeats();
    })();
  </script>
</body>
</html>
