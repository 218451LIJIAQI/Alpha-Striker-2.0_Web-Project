<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Auditorium Preview | Alpha Striker 2.0</title>
  <meta name="description" content="Preview the cinema auditorium interior and row sightlines in 3D before booking your seats.">
  <link rel="icon" href="../favicon.ico">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: #0b0e14; color: #f8fafc; }

    #viewer {
      width: 100%;
      height: 100%;
      position: relative;
      background: radial-gradient(circle at 50% 35%, #19243b 0%, #090c12 85%);
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1100px;
      user-select: none;
    }

    .top-bar {
      position: absolute;
      top: 20px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      z-index: 30;
      pointer-events: none;
    }

    .top-bar > * { pointer-events: auto; }

    #backBtn, .mode-btn {
      padding: 10px 18px;
      background: rgba(15, 23, 42, 0.84);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 999px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    #backBtn:hover, .mode-btn:hover, .mode-btn.active {
      background: #4361ee;
      border-color: #6ea8fe;
    }

    .mode-switcher { display: flex; gap: 8px; }

    /* Interactive 3D Stage */
    #hallStage {
      width: 740px;
      height: 480px;
      transform-style: preserve-3d;
      transform: rotateX(54deg) rotateZ(0deg);
      transition: transform 0.15s ease-out;
      position: relative;
    }

    .hall-floor {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(30, 41, 59, 0.92), rgba(15, 23, 42, 0.98));
      border: 2px solid rgba(99, 102, 241, 0.35);
      border-radius: 24px;
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.75);
      pointer-events: none;
    }

    .cinema-screen-3d {
      position: absolute;
      top: 26px;
      left: 80px;
      right: 80px;
      height: 92px;
      background: linear-gradient(180deg, #e0e7ff 0%, #60a5fa 45%, #1d4ed8 100%);
      border-radius: 10px;
      transform: translateZ(68px) rotateX(-72deg);
      transform-origin: bottom center;
      box-shadow: 0 18px 55px rgba(96, 165, 250, 0.52);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      letter-spacing: 4px;
      color: #0f172a;
      font-size: 15px;
      pointer-events: none;
    }

    .rows-3d {
      position: absolute;
      top: 112px;
      left: 70px;
      right: 70px;
      bottom: 34px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transform-style: preserve-3d;
    }

    .row-3d {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 5px 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.18s ease, transform 0.18s ease;
    }

    .row-3d:hover, .row-3d.active-row {
      background: rgba(67, 97, 238, 0.32);
    }

    .row-tag-3d {
      width: 22px;
      font-size: 12px;
      font-weight: 700;
      color: #94a3b8;
    }

    .seat-3d {
      width: 28px;
      height: 20px;
      border-radius: 5px 5px 8px 8px;
      background: #3b82f6;
      box-shadow: 0 4px 0 #1e3a8a;
    }

    .row-3d.vip-row .seat-3d {
      background: #f59e0b;
      box-shadow: 0 4px 0 #92400e;
    }

    .row-3d.active-row .seat-3d {
      background: #22c55e;
      box-shadow: 0 4px 0 #14532d;
    }

    #infoBox {
      position: absolute;
      bottom: 24px;
      left: 24px;
      background: rgba(15, 23, 42, 0.86);
      border: 1px solid rgba(255, 255, 255, 0.16);
      color: #e2e8f0;
      padding: 16px 20px;
      border-radius: 14px;
      max-width: 380px;
      font-size: 14px;
      z-index: 30;
      line-height: 1.55;
      backdrop-filter: blur(8px);
    }

    .camera-controls {
      position: absolute;
      bottom: 24px;
      right: 24px;
      background: rgba(15, 23, 42, 0.86);
      border: 1px solid rgba(255, 255, 255, 0.16);
      padding: 14px 18px;
      border-radius: 14px;
      z-index: 30;
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-size: 13px;
      min-width: 240px;
    }

    .camera-controls label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .camera-controls input[type="range"] { width: 130px; accent-color: #4361ee; }

    #modelFrame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      display: none;
      z-index: 20;
    }
  </style>
</head>
<body>
  <div id="viewer">
    <div class="top-bar">
      <button type="button" id="backBtn" aria-label="Return to seat booking">&larr; Back to Booking</button>
      <div class="mode-switcher">
        <button type="button" class="mode-btn active" id="btn-sim-mode">Interactive 3D Sightlines</button>
        <button type="button" class="mode-btn" id="btn-cloud-mode">Sketchfab Cloud Mesh</button>
      </div>
    </div>

    <div id="hallStage" aria-label="3D Auditorium Seat Sightline Simulator">
      <div class="hall-floor"></div>
      <div class="cinema-screen-3d">4K LASER SCREEN</div>
      <div class="rows-3d" id="rows3dMount"></div>
    </div>

    <div id="infoBox">
      <strong style="color:#fff; font-size:15px;" id="sightline-title">Auditorium Hall A — Row D (Prime VIP)</strong><br>
      <span id="sightline-metrics">Viewing Distance: 14.2m &bull; Vertical Angle: 15° (THX Optimal) &bull; Dolby Atmos Sweet Spot</span><br>
      <span style="font-size:12px; color:#94a3b8;">Click any row (A–H) or drag the stage to inspect sightlines.</span>
    </div>

    <div class="camera-controls" id="camControls">
      <label><span>Tilt Angle</span><input type="range" id="tiltSlider" min="25" max="72" value="54"></label>
      <label><span>Horizontal Pan</span><input type="range" id="yawSlider" min="-45" max="45" value="0"></label>
    </div>

    <iframe
      id="modelFrame"
      title="3D Cinema Auditorium Interior Preview"
      data-src="https://sketchfab.com/models/dcaf6cdebcad4f03879c24186da257ee/embed?autostart=1&ui_infos=0&ui_controls=1&ui_hint=0"
      allow="autoplay; fullscreen; xr-spatial-tracking"
      allowfullscreen>
    </iframe>
  </div>

  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const movieCode = params.get('movie_code');
      const theaterCode = params.get('theater_code');

      const backBtn = document.getElementById('backBtn');
      const stage = document.getElementById('hallStage');
      const rowsMount = document.getElementById('rows3dMount');
      const tiltSlider = document.getElementById('tiltSlider');
      const yawSlider = document.getElementById('yawSlider');
      const titleEl = document.getElementById('sightline-title');
      const metricsEl = document.getElementById('sightline-metrics');
      const frame = document.getElementById('modelFrame');
      const simBtn = document.getElementById('btn-sim-mode');
      const cloudBtn = document.getElementById('btn-cloud-mode');
      const camControls = document.getElementById('camControls');

      const rowSpecs = {
        A: { dist: '6.8m', angle: '34° Upward', note: 'Front immersive close-up view' },
        B: { dist: '9.2m', angle: '26° Upward', note: 'Wide peripheral field of view' },
        C: { dist: '11.6m', angle: '20° Balanced', note: 'Clear mid-front sightline' },
        D: { dist: '14.2m', angle: '15° THX Prime', note: 'Prime VIP acoustic & visual sweet spot' },
        E: { dist: '16.5m', angle: '13° THX Prime', note: 'Prime VIP elevated center perspective' },
        F: { dist: '18.9m', angle: '10° Eye-Level', note: 'Relaxed full-frame stadium elevation' },
        G: { dist: '21.3m', angle: '8° Stadium', note: 'High stadium overview with easy aisle access' },
        H: { dist: '23.8m', angle: '6° Rear Deck', note: 'Panoramic rear auditorium perspective' },
      };

      Object.keys(rowSpecs).forEach(function (letter, idx) {
        const row = document.createElement('div');
        const isVip = letter === 'D' || letter === 'E';
        row.className = 'row-3d' + (isVip ? ' vip-row' : '') + (letter === 'D' ? ' active-row' : '');
        row.style.transform = 'translateZ(' + ((idx + 1) * 8) + 'px)';
        row.setAttribute('tabindex', '0');
        row.setAttribute('role', 'button');
        row.setAttribute('aria-label', 'Inspect sightline for Row ' + letter);

        let html = '<span class="row-tag-3d">' + letter + '</span>';
        for (let s = 1; s <= 12; s++) {
          html += '<span class="seat-3d"></span>';
        }
        row.innerHTML = html;

        const selectRow = function () {
          rowsMount.querySelectorAll('.row-3d').forEach(function (r) { r.classList.remove('active-row'); });
          row.classList.add('active-row');
          const spec = rowSpecs[letter];
          titleEl.textContent = 'Auditorium Hall A — Row ' + letter + (isVip ? ' (Prime VIP)' : ' (Standard)');
          metricsEl.textContent = 'Distance: ' + spec.dist + ' • Sightline: ' + spec.angle + ' • ' + spec.note;
        };
        row.addEventListener('click', selectRow);
        row.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            selectRow();
          }
        });
        rowsMount.appendChild(row);
      });

      function updateTransform() {
        stage.style.transform = 'rotateX(' + tiltSlider.value + 'deg) rotateZ(' + yawSlider.value + 'deg)';
      }

      tiltSlider.addEventListener('input', updateTransform);
      yawSlider.addEventListener('input', updateTransform);

      let dragging = false;
      let startX = 0;
      let startY = 0;
      document.getElementById('viewer').addEventListener('mousedown', function (e) {
        if (e.target.closest('button, input, #infoBox, .camera-controls')) return;
        dragging = true;
        startX = e.clientX;
        startY = e.clientY;
      });
      window.addEventListener('mousemove', function (e) {
        if (!dragging) return;
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        startX = e.clientX;
        startY = e.clientY;
        yawSlider.value = String(Math.max(-45, Math.min(45, Number(yawSlider.value) + dx * 0.25)));
        tiltSlider.value = String(Math.max(25, Math.min(72, Number(tiltSlider.value) - dy * 0.2)));
        updateTransform();
      });
      window.addEventListener('mouseup', function () { dragging = false; });

      simBtn.addEventListener('click', function () {
        simBtn.classList.add('active');
        cloudBtn.classList.remove('active');
        frame.style.display = 'none';
        stage.style.display = 'block';
        camControls.style.display = 'flex';
      });

      cloudBtn.addEventListener('click', function () {
        cloudBtn.classList.add('active');
        simBtn.classList.remove('active');
        stage.style.display = 'none';
        camControls.style.display = 'none';
        if (!frame.getAttribute('src')) {
          frame.setAttribute('src', frame.getAttribute('data-src'));
        }
        frame.style.display = 'block';
      });

      backBtn.addEventListener('click', function () {
        if (movieCode) {
          const q = new URLSearchParams({ movie_code: movieCode });
          if (theaterCode) q.set('theater_code', theaterCode);
          window.location.href = 'booking3.html?' + q.toString();
        } else if (theaterCode) {
          window.location.href = 'theater-details.html?theater_code=' + encodeURIComponent(theaterCode);
        } else if (window.history.length > 1) {
          window.history.back();
        } else {
          window.location.href = 'homepage.html';
        }
      });
    })();
  </script>
</body>
</html>
