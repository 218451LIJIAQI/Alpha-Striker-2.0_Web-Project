<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Auditorium Preview | Alpha Striker 2.0</title>
  <meta name="description" content="Preview the cinema auditorium interior in 3D before booking your seats.">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: #0b0e14; color: #fff; }

    #viewer {
      width: 100%;
      height: 100%;
      position: relative;
      background: radial-gradient(circle at center, #182032 0%, #090c12 100%);
    }

    #backBtn {
      position: absolute;
      top: 20px;
      left: 20px;
      padding: 10px 18px;
      background: rgba(15, 23, 42, 0.78);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 999px;
      cursor: pointer;
      z-index: 20;
      font-size: 14px;
      font-weight: 600;
      transition: background 0.2s ease;
    }

    #backBtn:hover {
      background: rgba(67, 97, 238, 0.9);
    }

    #infoBox {
      position: absolute;
      bottom: 24px;
      left: 24px;
      background: rgba(15, 23, 42, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #e2e8f0;
      padding: 16px 20px;
      border-radius: 12px;
      max-width: 340px;
      font-size: 14px;
      z-index: 20;
      line-height: 1.5;
      backdrop-filter: blur(6px);
    }

    #loader {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border: 4px solid rgba(255, 255, 255, 0.18);
      border-top: 4px solid #4361ee;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      animation: spin 0.9s linear infinite;
      z-index: 10;
    }

    @keyframes spin {
      0% { transform: translate(-50%, -50%) rotate(0deg); }
      100% { transform: translate(-50%, -50%) rotate(360deg); }
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      opacity: 0;
      transition: opacity 0.6s ease-in;
    }

    iframe.loaded {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div id="viewer">
    <button type="button" id="backBtn" aria-label="Return to previous page">&larr; Back to Booking</button>
    <div id="loader" aria-hidden="true"></div>
    <div id="infoBox">
      <strong style="color:#fff; font-size:15px;">Auditorium Hall A — 3D Sightline Preview</strong><br>
      96 Reserved Seats &bull; Dolby Atmos &bull; 4K RGB Laser<br>
      Rows D &amp; E offer centered prime acoustic &amp; visual angles.
    </div>
    <iframe
      id="modelFrame"
      title="3D Cinema Auditorium Interior Preview"
      src="https://sketchfab.com/models/dcaf6cdebcad4f03879c24186da257ee/embed?autostart=1&ui_infos=0&ui_controls=1&ui_hint=0"
      allow="autoplay; fullscreen; xr-spatial-tracking"
      allowfullscreen>
    </iframe>
  </div>

  <script>
    (function () {
      var backBtn = document.getElementById('backBtn');
      var frame = document.getElementById('modelFrame');
      var loader = document.getElementById('loader');

      backBtn.addEventListener('click', function () {
        if (window.history.length > 1) {
          window.history.back();
        } else {
          window.location.href = 'homepage.html';
        }
      });

      frame.addEventListener('load', function () {
        frame.classList.add('loaded');
        if (loader) loader.style.display = 'none';
      });

      setTimeout(function () {
        if (loader) loader.style.display = 'none';
        frame.classList.add('loaded');
      }, 2500);
    })();
  </script>
</body>
</html>
