<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Theater Details | CineTix Box Office</title>
  <link rel="stylesheet" href="../css/common/header.css">
  <link rel="stylesheet" href="../css/common/footer.css">
  <link rel="stylesheet" href="../css/theater/theaterdetail.css">
  <script src="../js/common.js"></script>
  <script src="../js/theater/theaterdetail.js" defer></script>
</head>
<body>
  <div id="header-container"></div>

  <main class="theater-detail-container">
    <div class="theater-hero" id="theater-hero"></div>

    <div class="quick-info-grid" id="quick-info-grid"></div>

    <section class="section" id="now-showing-section">
      <h2 class="section-title">
        <i class="fas fa-film" aria-hidden="true"></i>
        <span>Now Showing at This Theater</span>
      </h2>
      <div class="movies-list" id="movies-list"></div>
    </section>

    <section class="section">
      <div class="tabs-container">
        <div class="tabs-header" role="tablist" aria-label="Cinema Amenities and Specifications">
          <button type="button" class="tab-btn active" id="tab-btn-facilities" data-tab="facilities" aria-controls="facilities-tab"><i class="fas fa-star" aria-hidden="true"></i> Facilities &amp; Amenities</button>
          <button type="button" class="tab-btn" id="tab-btn-technical" data-tab="technical" aria-controls="technical-tab"><i class="fas fa-cogs" aria-hidden="true"></i> Technical Specs</button>
          <button type="button" class="tab-btn" id="tab-btn-dining" data-tab="dining" aria-controls="dining-tab"><i class="fas fa-utensils" aria-hidden="true"></i> Food &amp; Dining</button>
          <button type="button" class="tab-btn" id="tab-btn-accessibility" data-tab="accessibility" aria-controls="accessibility-tab"><i class="fas fa-universal-access" aria-hidden="true"></i> Accessibility</button>
          <button type="button" class="tab-btn" id="tab-btn-safety" data-tab="safety" aria-controls="safety-tab"><i class="fas fa-shield-alt" aria-hidden="true"></i> Safety Measures</button>
        </div>

        <div class="tabs-content">
          <div class="tab-content active" id="facilities-tab" role="tabpanel" aria-labelledby="tab-btn-facilities"><div class="amenities-grid" id="amenities-grid"></div></div>
          <div class="tab-content" id="technical-tab" role="tabpanel" aria-labelledby="tab-btn-technical"><div class="amenities-grid" id="tech-specs-grid"></div></div>
          <div class="tab-content" id="dining-tab" role="tabpanel" aria-labelledby="tab-btn-dining"><div id="dining-info"></div></div>
          <div class="tab-content" id="accessibility-tab" role="tabpanel" aria-labelledby="tab-btn-accessibility"><div id="accessibility-info"></div></div>
          <div class="tab-content" id="safety-tab" role="tabpanel" aria-labelledby="tab-btn-safety"><div id="safety-measures"></div></div>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="info-cards-row">
        <div class="info-card detail-card">
          <h3><i class="fas fa-clock" aria-hidden="true"></i> Operating Hours</h3>
          <div id="operating-hours"></div>
        </div>
        <div class="info-card detail-card">
          <h3><i class="fas fa-ticket-alt" aria-hidden="true"></i> Ticket Pricing</h3>
          <div id="ticket-pricing"></div>
        </div>
        <div class="info-card detail-card">
          <h3><i class="fas fa-phone" aria-hidden="true"></i> Contact Information</h3>
          <div id="contact-info"></div>
        </div>
      </div>
    </section>

    <section class="section">
      <h2 class="section-title"><i class="fas fa-map-marker-alt" aria-hidden="true"></i> <span>Location &amp; Directions</span></h2>
      <div id="location-section"></div>
    </section>

    <section class="section">
      <h2 class="section-title"><i class="fas fa-star" aria-hidden="true"></i> <span>Customer Reviews</span></h2>
      <div id="reviews-section"></div>
    </section>

    <section class="section">
      <h2 class="section-title"><i class="fas fa-vr-cardboard" aria-hidden="true"></i> <span>Virtual Auditorium Tour</span></h2>
      <div id="virtual-tour"></div>
    </section>
  </main>

  <div id="bottom-container"></div>
</body>
</html>
