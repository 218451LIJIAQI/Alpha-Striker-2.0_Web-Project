<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Theater Details | Alpha Striker 2.0</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/common/header.css">
  <link rel="stylesheet" href="../css/common/footer.css">
  <link rel="stylesheet" href="../css/theater/theaterdetail.css">
  <script src="../js/common.js"></script>
  <script src="../js/theater/theaterdetail.js" defer></script>
</head>
<body>
  <div id="header-container"></div>

  <div class="theater-detail-container">
    <div class="theater-hero" id="theater-hero"></div>

    <div class="quick-info-grid" id="quick-info-grid"></div>

    <div class="section" id="now-showing-section">
      <h2 class="section-title">
        <i class="fas fa-film"></i>
        Now Showing at This Theater
      </h2>
      <div class="movies-list" id="movies-list"></div>
    </div>

    <div class="section">
      <div class="tabs-container">
        <div class="tabs-header">
          <button type="button" class="tab-btn active" data-tab="facilities"><i class="fas fa-star"></i> Facilities &amp; Amenities</button>
          <button type="button" class="tab-btn" data-tab="technical"><i class="fas fa-cogs"></i> Technical Specs</button>
          <button type="button" class="tab-btn" data-tab="dining"><i class="fas fa-utensils"></i> Food &amp; Dining</button>
          <button type="button" class="tab-btn" data-tab="accessibility"><i class="fas fa-universal-access"></i> Accessibility</button>
          <button type="button" class="tab-btn" data-tab="safety"><i class="fas fa-shield-alt"></i> Safety Measures</button>
        </div>

        <div class="tabs-content">
          <div class="tab-content active" id="facilities-tab"><div class="amenities-grid" id="amenities-grid"></div></div>
          <div class="tab-content" id="technical-tab"><div class="amenities-grid" id="tech-specs-grid"></div></div>
          <div class="tab-content" id="dining-tab"><div id="dining-info"></div></div>
          <div class="tab-content" id="accessibility-tab"><div id="accessibility-info"></div></div>
          <div class="tab-content" id="safety-tab"><div id="safety-measures"></div></div>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="info-cards-row">
        <div class="info-card detail-card">
          <h3><i class="fas fa-clock"></i> Operating Hours</h3>
          <div id="operating-hours"></div>
        </div>
        <div class="info-card detail-card">
          <h3><i class="fas fa-ticket-alt"></i> Ticket Pricing</h3>
          <div id="ticket-pricing"></div>
        </div>
        <div class="info-card detail-card">
          <h3><i class="fas fa-phone"></i> Contact Information</h3>
          <div id="contact-info"></div>
        </div>
      </div>
    </div>

    <div class="section">
      <h2 class="section-title"><i class="fas fa-map-marker-alt"></i> Location &amp; Directions</h2>
      <div id="location-section"></div>
    </div>

    <div class="section">
      <h2 class="section-title"><i class="fas fa-star"></i> Customer Reviews</h2>
      <div id="reviews-section"></div>
    </div>

    <div class="section">
      <h2 class="section-title"><i class="fas fa-vr-cardboard"></i> Virtual Auditorium Tour</h2>
      <div id="virtual-tour"></div>
    </div>
  </div>

  <div id="bottom-container"></div>
</body>
</html>
