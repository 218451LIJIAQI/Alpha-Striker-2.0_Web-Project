<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movies | Alpha Striker 2.0</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/common/header.css">
  <link rel="stylesheet" href="../css/common/footer.css">
  <link rel="stylesheet" href="../css/homepage/homepage.css">
  <script src="../js/common.js"></script>
  <script src="../js/homepage/homepage.js" defer></script>
</head>
<body>
  <div id="header-container"></div>

  <section class="hero">
    <div class="container">
      <h1>Experience Movies Like Never Before</h1>
      <p>Book tickets for the latest blockbusters and enjoy premium viewing experiences at theaters near you.</p>
      <div class="search-bar">
        <input type="text" class="search-input" aria-label="Search movies" placeholder="Search movies by title, genre, or tag...">
        <button type="button" class="search-btn">Search</button>
      </div>
    </div>
  </section>

  <main class="main-content">
    <div class="container">
      <div class="section-header">
        <h2 class="section-title">Now Showing</h2>
        <button type="button" class="btn btn-primary" id="view-all-movies-btn">View All</button>
      </div>

      <div class="filters" role="group" aria-label="Filter movies by genre">
        <button type="button" class="btn-filter active" data-genre="all">All</button>
        <button type="button" class="btn-filter" data-genre="Action">Action</button>
        <button type="button" class="btn-filter" data-genre="Adventure">Adventure</button>
        <button type="button" class="btn-filter" data-genre="Animation">Animation</button>
        <button type="button" class="btn-filter" data-genre="Drama">Drama</button>
        <button type="button" class="btn-filter" data-genre="Sci-Fi">Sci-Fi</button>
        <button type="button" class="btn-filter" data-genre="Mystery">Mystery</button>
      </div>

      <div class="movie-grid" aria-live="polite"></div>
    </div>
  </main>

  <div id="bottom-container"></div>
</body>
</html>
