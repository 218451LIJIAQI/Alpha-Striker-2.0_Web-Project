<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movies | CineTix Box Office</title>
  <link rel="stylesheet" href="../css/common/header.css">
  <link rel="stylesheet" href="../css/common/footer.css">
  <link rel="stylesheet" href="../css/homepage/homepage.css">
  <script src="../js/common.js"></script>
  <script src="../js/homepage/homepage.js" defer></script>
</head>
<body>
  <div id="header-container"></div>

  <section class="hero">
    <div class="container">
      <span class="hero-eyebrow">NOW BOOKING &bull; 30% GROUP SAVINGS ON 5+ SEATS</span>
      <h1>Experience Cinema Like Never Before</h1>
      <p>Inspect interactive 3D auditorium sightlines, lock reserved recliner seats, and redeem verified member promos.</p>
      <div class="search-bar" role="search">
        <input type="search" class="search-input" placeholder="Search movies by title, genre, or badge..." aria-label="Search movies by title, genre, or badge">
        <button type="button" class="search-btn">Search</button>
      </div>
    </div>
  </section>

  <main class="main-content">
    <div class="container">
      <div class="section-header">
        <div class="section-title-group">
          <h2 class="section-title">Now Showing</h2>
          <span class="catalog-count-badge tabular-nums" id="catalog-count-badge">7 Titles</span>
        </div>
        <button type="button" class="btn btn-primary" id="view-all-movies-btn">View All</button>
      </div>

      <div class="filters" role="group" aria-label="Filter movies by genre">
        <button type="button" class="btn-filter active" data-genre="all" aria-pressed="true">All</button>
        <button type="button" class="btn-filter" data-genre="Action" aria-pressed="false">Action</button>
        <button type="button" class="btn-filter" data-genre="Adventure" aria-pressed="false">Adventure</button>
        <button type="button" class="btn-filter" data-genre="Animation" aria-pressed="false">Animation</button>
        <button type="button" class="btn-filter" data-genre="Drama" aria-pressed="false">Drama</button>
        <button type="button" class="btn-filter" data-genre="Sci-Fi" aria-pressed="false">Sci-Fi</button>
        <button type="button" class="btn-filter" data-genre="Mystery" aria-pressed="false">Mystery</button>
      </div>

      <div class="movie-grid"></div>
    </div>
  </main>

  <div id="bottom-container"></div>
</body>
</html>
