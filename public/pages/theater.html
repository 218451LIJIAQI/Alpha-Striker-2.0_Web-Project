<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Theaters | Alpha Striker 2.0</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/common/header.css">
  <link rel="stylesheet" href="../css/common/footer.css">
  <link rel="stylesheet" href="../css/theater/theater.css">
  <script src="../js/common.js"></script>
  <script src="../js/theater/theater.js" defer></script>
</head>
<body>
  <div id="header-container"></div>

  <main class="container">
    <div class="theaters-header">
      <h1>Find Theaters Near You</h1>
      <p>Discover cinematic experiences across partner theaters — from IMAX laser screens to 4DX motion auditoriums and dine-in recliners.</p>
    </div>

    <div class="search-location">
      <input type="text" placeholder="Search by theater name, street, or district...">
      <button type="button">Search</button>
    </div>

    <div class="filter-options">
      <button type="button" class="active">All Theaters</button>
      <button type="button">IMAX</button>
      <button type="button">4DX</button>
      <button type="button">VIP</button>
      <button type="button">Dolby Atmos</button>
      <button type="button">RPX</button>
    </div>

    <div class="theater-list"></div>
  </main>

  <div id="bottom-container"></div>
</body>
</html>
