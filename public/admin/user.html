<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Users | CineTix Admin</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/common/header.css">
  <link rel="stylesheet" href="../css/admin/admin.css">
  <link rel="stylesheet" href="../css/common/dark-mode.css">
  <script src="../js/common.js"></script>
  <script src="../js/admin/admin.js"></script>
</head>
<body>
  <div id="admin-nav-container"></div>

  <main class="admin-content">
    <div class="page-header">
      <div>
        <h1><i class="fas fa-users"></i> Registered Users</h1>
        <p>Manage customer accounts (passwords are stored as salted bcrypt hashes and never exposed).</p>
      </div>
      <a href="add-user.html" class="add-btn"><i class="fas fa-user-plus"></i> Add User</a>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>User ID</th>
            <th>Display Name</th>
            <th>Email Address</th>
            <th>Registered At</th>
            <th>Last Updated</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="users-tbody">
          <tr><td colspan="6" class="empty-state">Loading users...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <script>
    async function loadUsers() {
      const tbody = document.getElementById('users-tbody');
      const res = await AdminApp.apiFetch('/index.php/admin/user/index');
      if (!res.success || !Array.isArray(res.data) || res.data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="empty-state">No registered users found.</td></tr>';
        return;
      }

      const esc = AdminApp.escapeHtml;
      tbody.innerHTML = res.data.map(function (u) {
        return (
          '<tr>' +
          '<td>#' + esc(u.user_code) + '</td>' +
          '<td><strong>' + esc(u.user_name) + '</strong></td>' +
          '<td>' + esc(u.email) + '</td>' +
          '<td>' + esc(u.create_time || '—') + '</td>' +
          '<td>' + esc(u.update_time || '—') + '</td>' +
          '<td><div class="action-buttons">' +
          '<a href="edit-user.html?user_code=' + encodeURIComponent(u.user_code) + '" class="edit-btn"><i class="fas fa-edit"></i> Edit</a>' +
          '<button type="button" class="delete-btn" data-id="' + esc(u.user_code) + '"><i class="fas fa-trash"></i> Delete</button>' +
          '</div></td>' +
          '</tr>'
        );
      }).join('');

      tbody.querySelectorAll('.delete-btn').forEach(function (btn) {
        btn.addEventListener('click', async function () {
          const id = btn.getAttribute('data-id');
          if (!window.confirm('Delete user #' + id + '?')) return;
          const delRes = await AdminApp.apiFetch('/index.php/admin/user/delete?user_code=' + encodeURIComponent(id), {
            method: 'POST',
            body: { user_code: id },
          });
          if (delRes.success) {
            window.showToast('User deleted', 'success');
            loadUsers();
          } else {
            window.showToast(delRes.message || 'Delete failed', 'error');
          }
        });
      });
    }

    document.addEventListener('DOMContentLoaded', async function () {
      AdminApp.renderAdminNav('users');
      if (!(await AdminApp.ensureAuthenticated())) return;
      loadUsers();
    });
  </script>
</body>
</html>
