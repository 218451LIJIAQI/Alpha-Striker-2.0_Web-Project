<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Users | CineTix Admin</title>
  <link rel="stylesheet" href="../css/common/header.css">
  <link rel="stylesheet" href="../css/admin/admin.css">
  <script src="../js/common.js"></script>
  <script src="../js/admin/admin.js"></script>
</head>
<body>
  <div id="admin-nav-container"></div>

  <main class="admin-content">
    <div class="page-header">
      <div>
        <h1><i class="fas fa-users" aria-hidden="true"></i> Registered Users</h1>
        <p>Manage customer accounts (passwords are stored as salted bcrypt hashes and never exposed).</p>
      </div>
      <a href="add-user.html" class="add-btn"><i class="fas fa-user-plus" aria-hidden="true"></i> Add User</a>
    </div>

    <div class="table-container">
      <div class="admin-table-toolbar" id="users-toolbar"></div>
      <table>
        <thead>
          <tr>
            <th class="check-col">
              <label class="sr-only" for="users-check-all">Select all users on page</label>
              <input type="checkbox" id="users-check-all" data-role="check-all" aria-label="Select all users on page">
            </th>
            <th>User ID</th>
            <th>Display Name</th>
            <th>Email Address</th>
            <th>Registered At</th>
            <th>Last Updated</th>
            <th class="actions-col">Actions</th>
          </tr>
        </thead>
        <tbody id="users-tbody">
          <tr><td colspan="7" class="empty-state">Loading users...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', async function () {
      AdminApp.renderAdminNav('users');
      if (!(await AdminApp.ensureAuthenticated())) return;

      const esc = AdminApp.escapeHtml;
      const tableCtrl = AdminApp.createTableController({
        endpoint: '/index.php/admin/user/index',
        toolbarId: 'users-toolbar',
        tbodyId: 'users-tbody',
        colSpan: 7,
        emptyText: 'No registered users found.',
        searchPlaceholder: 'Search by display name, email address, or user ID...',
        sorts: [
          { key: 'id_desc', label: 'Sort: Newest Member', compare: function (a, b) { return Number(b.user_code) - Number(a.user_code); } },
          { key: 'id_asc', label: 'Sort: User ID (Low–High)', compare: function (a, b) { return Number(a.user_code) - Number(b.user_code); } },
          { key: 'name_asc', label: 'Sort: Name (A–Z)', compare: function (a, b) { return String(a.user_name || '').localeCompare(String(b.user_name || '')); } },
        ],
        bulkAction: {
          label: 'Delete Selected',
          endpoint: '/index.php/admin/user/delete',
          idKey: 'user_code',
          batchKey: 'user_codes',
          confirmText: function (n) { return 'Delete ' + n + ' selected user account(s)? Private member vouchers will be removed and booked seats unlinked.'; },
          successPrefix: 'Deleted',
        },
        deleteAction: {
          endpoint: '/index.php/admin/user/delete',
          idKey: 'user_code',
          confirmText: function (id) { return 'Delete user #' + id + '? Private member vouchers will be removed and booked seats unlinked.'; },
          successText: 'User deleted',
        },
        exportCsv: {
          filename: 'cinetix-users.csv',
          headers: ['User ID', 'Display Name', 'Email Address', 'Registered At', 'Last Updated'],
          row: function (u) {
            return [u.user_code, u.user_name, u.email, u.create_time || '', u.update_time || ''];
          },
        },
        searchText: function (u) {
          return '#' + u.user_code + ' ' + (u.user_name || '') + ' ' + (u.email || '');
        },
        renderRow: function (u) {
          return (
            '<tr>' +
            '<td class="check-col"><label><span class="sr-only">Select user #' + esc(u.user_code) + '</span><input type="checkbox" class="row-check" value="' + esc(u.user_code) + '" aria-label="Select user #' + esc(u.user_code) + '"></label></td>' +
            '<td class="tabular-nums">#' + esc(u.user_code) + '</td>' +
            '<td><strong>' + esc(u.user_name) + '</strong></td>' +
            '<td>' + esc(u.email) + '</td>' +
            '<td class="tabular-nums">' + esc(u.create_time || '—') + '</td>' +
            '<td class="tabular-nums">' + esc(u.update_time || '—') + '</td>' +
            '<td class="actions-col"><div class="action-buttons">' +
            '<a href="edit-user.html?user_code=' + encodeURIComponent(u.user_code) + '" class="edit-btn"><i class="fas fa-edit" aria-hidden="true"></i> Edit</a>' +
            '<button type="button" class="delete-btn" data-id="' + esc(u.user_code) + '"><i class="fas fa-trash" aria-hidden="true"></i> Delete</button>' +
            '</div></td>' +
            '</tr>'
          );
        },
      });

      tableCtrl.reload();
    });
  </script>
</body>
</html>
