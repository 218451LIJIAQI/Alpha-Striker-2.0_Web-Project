<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Theaters | CineTix Admin</title>
  <link rel="stylesheet" href="../css/common/header.css">
  <link rel="stylesheet" href="../css/admin/admin.css">
  <script src="../js/common.js"></script>
  <script src="../js/admin/admin.js"></script>
</head>
<body>
  <div id="admin-nav-container"></div>

  <main class="admin-content">
    <div class="page-header">
      <div>
        <h1><i class="fas fa-building" aria-hidden="true"></i> Partner Theaters</h1>
        <p>Add, edit, or remove partner cinema locations and manage their scheduled movies.</p>
      </div>
      <button type="button" class="add-btn" id="open-add-theater-btn"><i class="fas fa-plus" aria-hidden="true"></i> Add Theater</button>
    </div>

    <form id="theater-form" class="form-container is-hidden" aria-label="Theater Editor">
      <h2 id="theater-form-heading"><i class="fas fa-plus-circle" aria-hidden="true"></i> Add Partner Theater</h2>
      <input type="hidden" id="theater_code" value="">

      <div class="form-grid">
        <div class="form-group">
          <label for="theater_name" class="form-label">Theater Name *</label>
          <input type="text" id="theater_name" class="form-input" placeholder="e.g. Pavilion IMAX Flagship" required maxlength="200">
        </div>

        <div class="form-group">
          <label for="theater_id" class="form-label">Location Code (Optional)</label>
          <input type="text" id="theater_id" class="form-input" placeholder="e.g. TH-007" maxlength="100">
        </div>

        <div class="form-group full-width">
          <label for="address" class="form-label">Street Address *</label>
          <input type="text" id="address" class="form-input" placeholder="e.g. 88 Cinema Boulevard, City Center" required maxlength="500">
        </div>

        <div class="form-group">
          <label for="amenity" class="form-label">Amenities (Comma-Separated)</label>
          <input type="text" id="amenity" class="form-input" placeholder="IMAX,Dolby Atmos,Recliner Seats" maxlength="500">
        </div>

        <div class="form-group">
          <label for="star" class="form-label">Rating (0.0 – 5.0) *</label>
          <input type="number" id="star" class="form-input tabular-nums" step="0.1" min="0" max="5" value="4.8" required>
        </div>

        <div class="form-group">
          <label for="distance" class="form-label">Distance Label</label>
          <input type="text" id="distance" class="form-input" placeholder="e.g. 1.5 miles" maxlength="50">
        </div>

        <div class="form-group">
          <label for="reviews" class="form-label">Reviews Label</label>
          <input type="text" id="reviews" class="form-input" placeholder="e.g. 195 reviews" maxlength="50">
        </div>

        <div class="form-group full-width">
          <label for="img" class="form-label">Image Path or URL *</label>
          <input type="text" id="img" class="form-input" placeholder="../img/theater/cinemark.jpeg" required maxlength="500">
          <div class="preview-container">
            <img id="theater-preview" class="preview-img" alt="Theater Preview">
          </div>
        </div>

        <div class="form-group full-width">
          <div class="form-label-row">
            <span class="form-label">Scheduled Movies</span>
            <div class="mini-link-group">
              <button type="button" class="mini-link-btn" id="theater-select-all-movies">Select All</button>
              <button type="button" class="mini-link-btn" id="theater-clear-movies">Clear</button>
            </div>
          </div>
          <div id="theater-movies-grid" class="relation-check-grid"></div>
        </div>
      </div>

      <div class="form-actions">
        <button type="button" class="cancel-btn" id="cancel-theater-form">Cancel</button>
        <button type="submit" class="submit-btn" id="save-theater-btn"><i class="fas fa-save" aria-hidden="true"></i> Save Theater</button>
      </div>
    </form>

    <div class="table-container">
      <div class="admin-table-toolbar" id="theaters-toolbar"></div>
      <table>
        <thead>
          <tr>
            <th class="check-col"><input type="checkbox" data-role="check-all" aria-label="Select all theaters on page"></th>
            <th>ID</th>
            <th>Photo</th>
            <th>Theater &amp; Code</th>
            <th>Address</th>
            <th>Amenities</th>
            <th>Rating</th>
            <th>Movies</th>
            <th class="actions-col">Actions</th>
          </tr>
        </thead>
        <tbody id="theaters-tbody">
          <tr><td colspan="9" class="empty-state">Loading theaters...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', async function () {
      AdminApp.renderAdminNav('theaters');
      if (!(await AdminApp.ensureAuthenticated())) return;

      const form = document.getElementById('theater-form');
      const heading = document.getElementById('theater-form-heading');
      const movieGrid = document.getElementById('theater-movies-grid');
      const imgInput = document.getElementById('img');
      const saveBtn = document.getElementById('save-theater-btn');
      const openAddBtn = document.getElementById('open-add-theater-btn');
      const syncPreview = AdminApp.bindImagePreview(imgInput, document.getElementById('theater-preview'));
      const esc = AdminApp.escapeHtml;
      let catalogMovies = [];
      let lastFormTrigger = null;

      AdminApp.bindCheckControls(movieGrid, 'theater-select-all-movies', 'theater-clear-movies');

      function closeEditorForm() {
        form.classList.add('is-hidden');
        const target = lastFormTrigger && lastFormTrigger.isConnected ? lastFormTrigger : openAddBtn;
        lastFormTrigger = null;
        target?.focus();
      }

      async function loadCatalogMovies() {
        try {
          const res = await AdminApp.apiFetch('/index.php/admin/movie/index');
          catalogMovies = res.success && Array.isArray(res.data) ? res.data : [];
        } catch (_) {
          catalogMovies = [];
        }
      }

      function openCreateForm() {
        lastFormTrigger = openAddBtn;
        document.getElementById('theater_code').value = '';
        document.getElementById('theater_name').value = '';
        document.getElementById('theater_id').value = '';
        document.getElementById('address').value = '';
        document.getElementById('amenity').value = 'IMAX,Dolby Atmos,Recliner Seats';
        document.getElementById('star').value = '4.8';
        document.getElementById('distance').value = '2.0 miles';
        document.getElementById('reviews').value = '150 reviews';
        imgInput.value = '../img/theater/cinemark.jpeg';
        syncPreview();
        heading.innerHTML = '<i class="fas fa-plus-circle" aria-hidden="true"></i> Add Partner Theater';
        AdminApp.renderCheckList(movieGrid, catalogMovies, 'movie_code', function (m) { return m.movie_name; }, null);
        form.classList.remove('is-hidden');
        document.getElementById('theater_name').focus();
      }

      async function openEditForm(theaterCode, triggerBtn) {
        lastFormTrigger = triggerBtn || openAddBtn;
        try {
          const res = await AdminApp.apiFetch('/index.php/admin/theater/getTheaterByCode?theater_code=' + encodeURIComponent(theaterCode));
          if (!res.success || !res.data) {
            window.showToast(res.message || 'Theater not found', 'error');
            return;
          }
          const t = res.data;
          document.getElementById('theater_code').value = String(t.theater_code);
          document.getElementById('theater_name').value = t.theater_name || '';
          document.getElementById('theater_id').value = t.theater_id || '';
          document.getElementById('address').value = t.address || '';
          document.getElementById('amenity').value = t.amenity || '';
          document.getElementById('star').value = t.star !== undefined ? t.star : '4.8';
          document.getElementById('distance').value = t.distance || '';
          document.getElementById('reviews').value = t.reviews || '';
          imgInput.value = t.img || '';
          syncPreview();
          heading.innerHTML = '<i class="fas fa-edit" aria-hidden="true"></i> Edit Theater #' + esc(t.theater_code);
          AdminApp.renderCheckList(
            movieGrid,
            catalogMovies,
            'movie_code',
            function (m) { return m.movie_name; },
            Array.isArray(t.movie_codes) ? t.movie_codes : []
          );
          form.classList.remove('is-hidden');
          document.getElementById('theater_name').focus();
        } catch (_) {
          window.showToast('Unable to load theater details', 'error');
        }
      }

      const tableCtrl = AdminApp.createTableController({
        endpoint: '/index.php/admin/theater/index',
        toolbarId: 'theaters-toolbar',
        tbodyId: 'theaters-tbody',
        colSpan: 9,
        emptyText: 'No theaters found.',
        searchPlaceholder: 'Search by theater name, code, address, or amenity...',
        filters: [
          { value: 'all', label: 'All Formats' },
          { value: 'IMAX', label: 'IMAX' },
          { value: '4DX', label: '4DX' },
          { value: 'VIP', label: 'VIP' },
          { value: 'Dolby Atmos', label: 'Dolby Atmos' },
          { value: 'RPX', label: 'RPX' },
        ],
        sorts: [
          { key: 'id_asc', label: 'Sort: ID (Low–High)', compare: function (a, b) { return Number(a.theater_code) - Number(b.theater_code); } },
          { key: 'name_asc', label: 'Sort: Name (A–Z)', compare: function (a, b) { return String(a.theater_name || '').localeCompare(String(b.theater_name || '')); } },
          { key: 'rating_desc', label: 'Sort: Rating (High–Low)', compare: function (a, b) { return (parseFloat(b.star) || 0) - (parseFloat(a.star) || 0); } },
        ],
        bulkAction: {
          label: 'Delete Selected',
          endpoint: '/index.php/admin/theater/delete',
          idKey: 'theater_code',
          confirmText: function (n) { return 'Delete ' + n + ' selected theater(s)? Related schedules and seat bookings will also be removed.'; },
          successPrefix: 'Deleted',
        },
        deleteAction: {
          endpoint: '/index.php/admin/theater/delete',
          idKey: 'theater_code',
          confirmText: function (id) { return 'Delete theater #' + id + '? Related schedules and seat bookings will also be removed.'; },
          successText: 'Theater deleted',
        },
        exportCsv: {
          filename: 'cinetix-theaters.csv',
          headers: ['ID', 'Location Code', 'Theater Name', 'Address', 'Distance', 'Amenities', 'Rating', 'Reviews', 'Scheduled Movies'],
          row: function (t) {
            const mCount = Array.isArray(t.movie_codes) ? t.movie_codes.length : (t.movie_count || 0);
            return [t.theater_code, t.theater_id || '', t.theater_name, t.address, t.distance || '', t.amenity || '', t.star, t.reviews || '', mCount];
          },
        },
        searchText: function (t) {
          return '#' + t.theater_code + ' ' + (t.theater_name || '') + ' ' + (t.theater_id || '') + ' ' + (t.address || '') + ' ' + (t.amenity || '');
        },
        matchFilter: function (t, val) {
          return String(t.amenity || '').toLowerCase().includes(val.toLowerCase());
        },
        renderRow: function (t) {
          const thumb = AdminApp.resolveAdminAsset(t.img);
          const mCount = Array.isArray(t.movie_codes) ? t.movie_codes.length : (t.movie_count || 0);
          return (
            '<tr>' +
            '<td class="check-col"><input type="checkbox" class="row-check" value="' + esc(t.theater_code) + '" aria-label="Select theater #' + esc(t.theater_code) + '"></td>' +
            '<td class="tabular-nums">#' + esc(t.theater_code) + '</td>' +
            '<td><img src="' + esc(thumb) + '" alt="' + esc(t.theater_name) + '" class="theater-thumb"></td>' +
            '<td><strong>' + esc(t.theater_name) + '</strong><br><small class="sub-meta tabular-nums">' + esc(t.theater_id || '—') + '</small></td>' +
            '<td>' + esc(t.address) + (t.distance ? '<br><small class="sub-meta">' + esc(t.distance) + '</small>' : '') + '</td>' +
            '<td>' + esc(t.amenity || '—') + '</td>' +
            '<td class="tabular-nums"><i class="fas fa-star star-amber" aria-hidden="true"></i> ' + esc(t.star) + '</td>' +
            '<td><span class="scope-badge tabular-nums">' + esc(mCount + ' film' + (mCount === 1 ? '' : 's')) + '</span></td>' +
            '<td class="actions-col"><div class="action-buttons">' +
            '<button type="button" class="edit-btn edit-theater-btn" data-id="' + esc(t.theater_code) + '"><i class="fas fa-edit" aria-hidden="true"></i> Edit</button>' +
            '<button type="button" class="delete-btn" data-id="' + esc(t.theater_code) + '"><i class="fas fa-trash" aria-hidden="true"></i> Delete</button>' +
            '</div></td>' +
            '</tr>'
          );
        },
        afterRender: function (tbody) {
          tbody.querySelectorAll('.edit-theater-btn').forEach(function (btn) {
            btn.addEventListener('click', function () {
              openEditForm(btn.getAttribute('data-id'), btn);
            });
          });
        },
      });

      openAddBtn.addEventListener('click', openCreateForm);
      document.getElementById('cancel-theater-form').addEventListener('click', closeEditorForm);
      window.addEventListener('cinetix:escape', function () {
        if (!form.classList.contains('is-hidden')) {
          closeEditorForm();
        }
      });

      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        if (saveBtn.disabled) return;
        saveBtn.disabled = true;

        const editingCode = document.getElementById('theater_code').value.trim();
        const endpoint = editingCode ? '/index.php/admin/theater/update' : '/index.php/admin/theater/create';
        const payload = {
          theater_name: document.getElementById('theater_name').value.trim(),
          theater_id: document.getElementById('theater_id').value.trim(),
          address: document.getElementById('address').value.trim(),
          amenity: document.getElementById('amenity').value.trim(),
          star: document.getElementById('star').value,
          distance: document.getElementById('distance').value.trim(),
          reviews: document.getElementById('reviews').value.trim(),
          img: imgInput.value.trim(),
          movie_codes: AdminApp.getCheckedIds(movieGrid),
        };
        if (editingCode) payload.theater_code = editingCode;

        try {
          const res = await AdminApp.apiFetch(endpoint, { method: 'POST', body: payload });
          if (res.success) {
            window.showToast(editingCode ? 'Theater updated successfully' : 'Theater created successfully', 'success');
            await tableCtrl.reload();
            closeEditorForm();
          } else {
            window.showToast(res.message || 'Failed to save theater', 'error');
          }
        } catch (_) {
          window.showToast('Network error while saving theater', 'error');
        } finally {
          saveBtn.disabled = false;
        }
      });

      await Promise.all([loadCatalogMovies(), tableCtrl.reload()]);
    });
  </script>
</body>
</html>
