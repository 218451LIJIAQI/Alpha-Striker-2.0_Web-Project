<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit User | CineTix Admin</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/common/header.css">
  <link rel="stylesheet" href="../css/admin/admin.css">
  <script src="../js/common.js"></script>
  <script src="../js/admin/admin.js"></script>
</head>
<body>
  <div id="admin-nav-container"></div>

  <main class="admin-content narrow">
    <div class="page-header">
      <div>
        <h1><i class="fas fa-user-edit"></i> Edit User Account</h1>
        <p>Update user profile information or optionally set a new password.</p>
      </div>
    </div>

    <form id="edit-user-form" class="form-container">
      <div class="form-grid">
        <div class="form-group">
          <label for="user_name" class="form-label">Display Name *</label>
          <input type="text" id="user_name" name="user_name" class="form-input" required maxlength="50">
        </div>

        <div class="form-group">
          <label for="email" class="form-label">Email Address *</label>
          <input type="email" id="email" name="email" class="form-input" required maxlength="100">
        </div>

        <div class="form-group full-width">
          <label for="login_pwd" class="form-label">New Password (Optional)</label>
          <input type="password" id="login_pwd" name="login_pwd" class="form-input" placeholder="Leave blank to keep current password" minlength="6">
          <span class="form-hint">Only fill this field if you want to reset the user's password.</span>
        </div>
      </div>

      <div class="form-actions">
        <a href="user.html" class="cancel-btn">Cancel</a>
        <button type="submit" class="submit-btn"><i class="fas fa-save"></i> Save Changes</button>
      </div>
    </form>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', async function () {
      AdminApp.renderAdminNav('users');
      if (!(await AdminApp.ensureAuthenticated())) return;

      const userCode = new URLSearchParams(window.location.search).get('user_code');
      if (!userCode) {
        window.location.href = 'user.html';
        return;
      }

      const detailRes = await AdminApp.apiFetch('/index.php/admin/user/getUserByCode?user_code=' + encodeURIComponent(userCode));
      if (!detailRes.success || !detailRes.data) {
        window.showToast(detailRes.message || 'User not found', 'error');
        setTimeout(function () { window.location.href = 'user.html'; }, 700);
        return;
      }

      document.getElementById('user_name').value = detailRes.data.user_name || '';
      document.getElementById('email').value = detailRes.data.email || '';

      document.getElementById('edit-user-form').addEventListener('submit', function (e) {
        e.preventDefault();
        AdminApp.submitForm('/index.php/admin/user/update', {
          user_code: userCode,
          user_name: document.getElementById('user_name').value.trim(),
          email: document.getElementById('email').value.trim(),
          login_pwd: document.getElementById('login_pwd').value,
        }, 'user.html', 'User updated successfully', 'Failed to update user');
      });
    });
  </script>
</body>
</html>
