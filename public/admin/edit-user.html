<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit User | CineTix Admin</title>
  <link rel="stylesheet" href="../css/common/header.css">
  <link rel="stylesheet" href="../css/admin/admin.css">
  <script src="../js/common.js"></script>
  <script src="../js/admin/admin.js"></script>
</head>
<body>
  <div id="admin-nav-container"></div>

  <main class="admin-content narrow">
    <div class="page-header">
      <div>
        <h1><i class="fas fa-user-edit" aria-hidden="true"></i> Edit User Account</h1>
        <p>Update user profile information or optionally set a new password.</p>
      </div>
    </div>

    <form id="edit-user-form" class="form-container" novalidate>
      <div class="form-grid">
        <div class="form-group">
          <label for="user_name" class="form-label">Display Name *</label>
          <input type="text" id="user_name" name="user_name" class="form-input" required maxlength="50" autocomplete="name">
        </div>

        <div class="form-group">
          <label for="email" class="form-label">Email Address *</label>
          <input type="email" id="email" name="email" class="form-input" required maxlength="100" autocomplete="email">
        </div>

        <div class="form-group full-width">
          <label for="login_pwd" class="form-label">New Password (Optional)</label>
          <input type="password" id="login_pwd" name="login_pwd" class="form-input" placeholder="Leave blank to keep current password (6–72 UTF-8 bytes)" minlength="6" maxlength="72" autocomplete="new-password">
          <span class="form-hint">Only fill this field if you want to reset the user's password.</span>
        </div>
      </div>

      <div class="form-actions">
        <a href="user.html" class="cancel-btn">Cancel</a>
        <button type="submit" class="submit-btn"><i class="fas fa-save" aria-hidden="true"></i> Save Changes</button>
      </div>
    </form>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', async function () {
      AdminApp.renderAdminNav('users');
      if (!(await AdminApp.ensureAuthenticated())) return;

      const userCode = AdminApp.getQueryId('user_code', 'user.html');
      if (!userCode) return;

      const formEl = document.getElementById('edit-user-form');
      const pwdInput = document.getElementById('login_pwd');

      try {
        const detailRes = await AdminApp.apiFetch('/index.php/admin/user/getUserByCode?user_code=' + encodeURIComponent(userCode));
        if (!detailRes.success || !detailRes.data) {
          window.showToast(detailRes.message || 'User not found', 'error');
          AdminApp.renderFormLoadError(formEl, detailRes.message || 'User not found.', 'user.html', 'Back to Users');
          return;
        }
        document.getElementById('user_name').value = detailRes.data.user_name || '';
        document.getElementById('email').value = detailRes.data.email || '';
      } catch (_) {
        window.showToast('Unable to load user details', 'error');
        AdminApp.renderFormLoadError(formEl, 'Connection failed while loading user details.', 'user.html', 'Back to Users', function () {
          window.location.reload();
        });
        return;
      }

      formEl.addEventListener('submit', function (e) {
        e.preventDefault();
        const CT = window.CineTicket;
        const nameEl = document.getElementById('user_name');
        const emailEl = document.getElementById('email');

        if (!AdminApp.validateFields([
          { el: nameEl, check: function (v) { return v.trim().length > 0 && v.trim().length <= 50; }, message: 'Display name is required (max 50 characters)' },
          { el: emailEl, check: function (v) { return CT.isValidEmail(v); }, message: 'Please enter a valid email address' },
          { el: pwdInput, check: function (v) { return v === '' || CT.isValidPasswordBytes(v); }, message: 'New password must be 6-72 UTF-8 bytes' },
        ])) {
          return;
        }

        AdminApp.submitForm('/index.php/admin/user/update', {
          user_code: userCode,
          user_name: nameEl.value.trim(),
          email: emailEl.value.trim(),
          login_pwd: pwdInput.value,
        }, 'user.html', 'User updated successfully', 'Failed to update user', e.submitter);
      });
    });
  </script>
</body>
</html>
