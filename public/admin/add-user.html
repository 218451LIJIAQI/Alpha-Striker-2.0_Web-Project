<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add User | CineTix Admin</title>
  <link rel="stylesheet" href="../css/common/header.css">
  <link rel="stylesheet" href="../css/admin/admin.css">
  <script src="../js/common.js"></script>
  <script src="../js/admin/admin.js"></script>
</head>
<body>
  <div id="admin-nav-container"></div>

  <main class="admin-content narrow">
    <div class="page-header">
      <div>
        <h1><i class="fas fa-user-plus" aria-hidden="true"></i> Add Registered User</h1>
        <p>Create a new customer account with bcrypt password hashing.</p>
      </div>
    </div>

    <form id="add-user-form" class="form-container">
      <div class="form-grid">
        <div class="form-group">
          <label for="user_name" class="form-label">Display Name *</label>
          <input type="text" id="user_name" name="user_name" class="form-input" placeholder="e.g. Jane Tan" required maxlength="50" autocomplete="name">
        </div>

        <div class="form-group">
          <label for="email" class="form-label">Email Address *</label>
          <input type="email" id="email" name="email" class="form-input" placeholder="jane@example.com" required maxlength="100" autocomplete="email">
        </div>

        <div class="form-group full-width">
          <label for="login_pwd" class="form-label">Initial Password *</label>
          <input type="password" id="login_pwd" name="login_pwd" class="form-input" placeholder="6 to 72 UTF-8 bytes" required minlength="6" maxlength="72" autocomplete="new-password">
        </div>
      </div>

      <div class="form-actions">
        <a href="user.html" class="cancel-btn">Cancel</a>
        <button type="submit" class="submit-btn"><i class="fas fa-save" aria-hidden="true"></i> Create User</button>
      </div>
    </form>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', async function () {
      AdminApp.renderAdminNav('users');
      if (!(await AdminApp.ensureAuthenticated())) return;

      const formEl = document.getElementById('add-user-form');
      const CT = window.CineTicket;
      CT.bindFieldErrorClear(formEl);

      formEl.addEventListener('submit', function (e) {
        e.preventDefault();
        const nameEl = document.getElementById('user_name');
        const emailEl = document.getElementById('email');
        const pwdEl = document.getElementById('login_pwd');
        [nameEl, emailEl, pwdEl].forEach(CT.clearFieldError);

        const userName = nameEl.value.trim();
        const email = emailEl.value.trim();
        const pwd = pwdEl.value;

        if (!userName || userName.length > 50) {
          CT.flagFieldError(nameEl, 'Display name (1-50 characters) is required');
          window.showToast('Please enter a valid display name', 'warning');
          return;
        }
        if (!CT.isValidEmail(email)) {
          CT.flagFieldError(emailEl, 'Please enter a valid email address');
          window.showToast('Please enter a valid email address', 'warning');
          return;
        }
        if (!CT.isValidPasswordBytes(pwd)) {
          CT.flagFieldError(pwdEl, 'Initial password must be 6-72 UTF-8 bytes');
          window.showToast('Initial password must be 6-72 UTF-8 bytes', 'warning');
          return;
        }
        AdminApp.submitForm('/index.php/admin/user/create', {
          user_name: userName,
          email: email,
          login_pwd: pwd,
        }, 'user.html', 'User created successfully', 'Failed to create user', e.submitter);
      });
    });
  </script>
</body>
</html>
