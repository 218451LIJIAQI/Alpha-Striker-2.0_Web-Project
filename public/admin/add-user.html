<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add User | CineTix Admin</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/common/header.css">
  <link rel="stylesheet" href="../css/admin/admin.css">
  <link rel="stylesheet" href="../css/common/dark-mode.css">
  <script src="../js/common.js"></script>
  <script src="../js/admin/admin.js"></script>
</head>
<body>
  <div id="admin-nav-container"></div>

  <main class="admin-content narrow">
    <div class="page-header">
      <div>
        <h1><i class="fas fa-user-plus"></i> Add Registered User</h1>
        <p>Create a new customer account with bcrypt password hashing.</p>
      </div>
    </div>

    <form id="add-user-form" class="form-container">
      <div class="form-grid">
        <div class="form-group">
          <label for="user_name" class="form-label">Display Name *</label>
          <input type="text" id="user_name" name="user_name" class="form-input" placeholder="e.g. Jane Tan" required maxlength="50">
        </div>

        <div class="form-group">
          <label for="email" class="form-label">Email Address *</label>
          <input type="email" id="email" name="email" class="form-input" placeholder="jane@example.com" required maxlength="100">
        </div>

        <div class="form-group full-width">
          <label for="login_pwd" class="form-label">Initial Password *</label>
          <input type="password" id="login_pwd" name="login_pwd" class="form-input" placeholder="At least 6 characters" required minlength="6">
        </div>
      </div>

      <div class="form-actions">
        <a href="user.html" class="cancel-btn">Cancel</a>
        <button type="submit" class="submit-btn"><i class="fas fa-save"></i> Create User</button>
      </div>
    </form>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', async function () {
      AdminApp.renderAdminNav('users');
      if (!(await AdminApp.ensureAuthenticated())) return;

      document.getElementById('add-user-form').addEventListener('submit', async function (e) {
        e.preventDefault();
        const payload = {
          user_name: document.getElementById('user_name').value.trim(),
          email: document.getElementById('email').value.trim(),
          login_pwd: document.getElementById('login_pwd').value,
        };

        const res = await AdminApp.apiFetch('/index.php/admin/user/create', {
          method: 'POST',
          body: payload,
        });
        if (res.success) {
          window.showToast('User created successfully', 'success');
          setTimeout(function () { window.location.href = 'user.html'; }, 500);
        } else {
          window.showToast(res.message || 'Failed to create user', 'error');
        }
      });
    });
  </script>
</body>
</html>
