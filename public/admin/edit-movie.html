<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Movie | CineTix Admin</title>
  <link rel="stylesheet" href="../css/common/header.css">
  <link rel="stylesheet" href="../css/admin/admin.css">
  <script src="../js/common.js"></script>
  <script src="../js/admin/admin.js"></script>
</head>
<body>
  <div id="admin-nav-container"></div>

  <main class="admin-content narrow">
    <div class="page-header">
      <div>
        <h1><i class="fas fa-edit" aria-hidden="true"></i> Edit Movie</h1>
        <p>Update title, genre, runtime, ticket price, highlight badge, or assigned theaters.</p>
      </div>
    </div>

    <form id="edit-movie-form" class="form-container">
      <div class="form-grid">
        <div class="form-group full-width">
          <label for="movie_name" class="form-label">Movie Title *</label>
          <input type="text" id="movie_name" name="movie_name" class="form-input" required maxlength="200">
        </div>

        <div class="form-group">
          <label for="movie_type" class="form-label">Primary Genre *</label>
          <select id="movie_type" name="movie_type" class="form-input" required>
            <option value="Action">Action</option>
            <option value="Adventure">Adventure</option>
            <option value="Animation">Animation</option>
            <option value="Drama">Drama</option>
            <option value="Sci-Fi">Sci-Fi</option>
            <option value="Mystery">Mystery</option>
            <option value="Comedy">Comedy</option>
            <option value="Horror">Horror</option>
          </select>
        </div>

        <div class="form-group">
          <label for="times" class="form-label">Duration *</label>
          <input type="text" id="times" name="times" class="form-input" required maxlength="50">
        </div>

        <div class="form-group">
          <label for="star" class="form-label">Rating (0.0 – 5.0) *</label>
          <input type="number" id="star" name="star" class="form-input tabular-nums" step="0.1" min="0" max="5" required>
        </div>

        <div class="form-group">
          <label for="money" class="form-label">Ticket Price ($) *</label>
          <input type="number" id="money" name="money" class="form-input tabular-nums" step="0.01" min="0" required>
        </div>

        <div class="form-group">
          <label for="tag" class="form-label">Highlight Badge (Optional)</label>
          <input type="text" id="tag" name="tag" class="form-input" maxlength="50">
        </div>

        <div class="form-group full-width">
          <label for="img" class="form-label">Poster Path or URL *</label>
          <input type="text" id="img" name="img" class="form-input" required maxlength="500">
          <div class="preview-container">
            <img id="poster-preview" class="preview-img" alt="Poster Preview">
          </div>
        </div>

        <div class="form-group full-width">
          <div class="form-label-row">
            <span class="form-label">Screening Theaters</span>
            <div class="mini-link-group">
              <button type="button" class="mini-link-btn" id="select-all-theaters">Select All</button>
              <button type="button" class="mini-link-btn" id="clear-all-theaters">Clear</button>
            </div>
          </div>
          <div id="theater-check-grid" class="relation-check-grid"></div>
        </div>
      </div>

      <div class="form-actions">
        <a href="movies.html" class="cancel-btn">Cancel</a>
        <button type="submit" class="submit-btn"><i class="fas fa-save" aria-hidden="true"></i> Save Changes</button>
      </div>
    </form>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', async function () {
      AdminApp.renderAdminNav('movies');
      if (!(await AdminApp.ensureAuthenticated())) return;

      const movieCode = new URLSearchParams(window.location.search).get('movie_code');
      if (!movieCode) {
        window.location.href = 'movies.html';
        return;
      }

      const imgInput = document.getElementById('img');
      const syncPreview = AdminApp.bindImagePreview(imgInput, document.getElementById('poster-preview'));
      const theaterGrid = document.getElementById('theater-check-grid');
      AdminApp.bindCheckControls(theaterGrid, 'select-all-theaters', 'clear-all-theaters');

      const [detailRes, theatersRes] = await Promise.all([
        AdminApp.apiFetch('/index.php/admin/movie/getMovieByCode?movie_code=' + encodeURIComponent(movieCode)),
        AdminApp.apiFetch('/index.php/admin/theater/index'),
      ]);
      if (!detailRes.success || !detailRes.data) {
        window.showToast(detailRes.message || 'Movie not found', 'error');
        setTimeout(function () { window.location.href = 'movies.html'; }, 700);
        return;
      }

      const m = detailRes.data;
      document.getElementById('movie_name').value = m.movie_name || '';
      document.getElementById('movie_type').value = m.movie_type || 'Action';
      document.getElementById('times').value = m.times || '';
      document.getElementById('star').value = m.star !== undefined ? m.star : '5.0';
      document.getElementById('money').value = m.money !== undefined ? m.money : '39.00';
      document.getElementById('tag').value = m.tag || '';
      imgInput.value = m.img || '';
      syncPreview();

      const theaters = theatersRes.success && Array.isArray(theatersRes.data) ? theatersRes.data : [];
      AdminApp.renderCheckList(
        theaterGrid,
        theaters,
        'theater_code',
        function (t) { return t.theater_name; },
        Array.isArray(m.theater_codes) ? m.theater_codes : []
      );

      document.getElementById('edit-movie-form').addEventListener('submit', function (e) {
        e.preventDefault();
        AdminApp.submitForm('/index.php/admin/movie/update', {
          movie_code: movieCode,
          movie_name: document.getElementById('movie_name').value.trim(),
          movie_type: document.getElementById('movie_type').value,
          times: document.getElementById('times').value.trim(),
          star: document.getElementById('star').value,
          money: document.getElementById('money').value,
          tag: document.getElementById('tag').value.trim(),
          img: imgInput.value.trim(),
          theater_codes: AdminApp.getCheckedIds(theaterGrid),
        }, 'movies.html', 'Movie updated successfully', 'Failed to update movie', e.submitter);
      });
    });
  </script>
</body>
</html>
