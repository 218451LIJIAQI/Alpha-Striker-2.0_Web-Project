<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Movies | CineTix Admin</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/common/header.css">
  <link rel="stylesheet" href="../css/admin/admin.css">
  <link rel="stylesheet" href="../css/common/dark-mode.css">
  <script src="../js/common.js"></script>
  <script src="../js/admin/admin.js"></script>
</head>
<body>
  <div id="admin-nav-container"></div>

  <main class="admin-content">
    <div class="page-header">
      <div>
        <h1><i class="fas fa-film"></i> Movie Catalog</h1>
        <p>Add, edit, or remove feature films available for ticket booking.</p>
      </div>
      <a href="add-movie.html" class="add-btn"><i class="fas fa-plus"></i> Add Movie</a>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Poster</th>
            <th>Title</th>
            <th>Genre</th>
            <th>Duration</th>
            <th>Rating</th>
            <th>Price</th>
            <th>Badge</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="movies-tbody">
          <tr><td colspan="9" class="empty-state">Loading movies...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <script>
    async function loadMovies() {
      const tbody = document.getElementById('movies-tbody');
      const res = await AdminApp.apiFetch('/index.php/admin/movie/index');
      if (!res.success || !Array.isArray(res.data) || res.data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="9" class="empty-state">No movies found.</td></tr>';
        return;
      }

      const esc = AdminApp.escapeHtml;
      tbody.innerHTML = res.data.map(function (m) {
        const poster = AdminApp.resolveAdminAsset(m.img);
        const price = '$' + (parseFloat(m.money) || 0).toFixed(2);
        const tagHtml = m.tag ? '<span class="tag-badge">' + esc(m.tag) + '</span>' : '<span style="opacity:0.45;">—</span>';
        return (
          '<tr>' +
          '<td>#' + esc(m.movie_code) + '</td>' +
          '<td><img src="' + esc(poster) + '" alt="' + esc(m.movie_name) + '" class="movie-poster"></td>' +
          '<td><strong>' + esc(m.movie_name) + '</strong></td>' +
          '<td><span class="type-badge">' + esc(m.movie_type) + '</span></td>' +
          '<td>' + esc(m.times) + '</td>' +
          '<td><i class="fas fa-star" style="color:#f59e0b;"></i> ' + esc(m.star) + '</td>' +
          '<td><strong>' + esc(price) + '</strong></td>' +
          '<td>' + tagHtml + '</td>' +
          '<td><div class="action-buttons">' +
          '<a href="edit-movie.html?movie_code=' + encodeURIComponent(m.movie_code) + '" class="edit-btn"><i class="fas fa-edit"></i> Edit</a>' +
          '<button type="button" class="delete-btn" data-id="' + esc(m.movie_code) + '"><i class="fas fa-trash"></i> Delete</button>' +
          '</div></td>' +
          '</tr>'
        );
      }).join('');

      tbody.querySelectorAll('.delete-btn').forEach(function (btn) {
        btn.addEventListener('click', async function () {
          const id = btn.getAttribute('data-id');
          if (!window.confirm('Delete movie #' + id + '? Related seat bookings will also be removed.')) return;
          const delRes = await AdminApp.apiFetch('/index.php/admin/movie/delete?movie_code=' + encodeURIComponent(id), {
            method: 'POST',
            body: { movie_code: id },
          });
          if (delRes.success) {
            window.showToast('Movie deleted', 'success');
            loadMovies();
          } else {
            window.showToast(delRes.message || 'Delete failed', 'error');
          }
        });
      });
    }

    document.addEventListener('DOMContentLoaded', async function () {
      AdminApp.renderAdminNav('movies');
      if (!(await AdminApp.ensureAuthenticated())) return;
      loadMovies();
    });
  </script>
</body>
</html>
