<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Offers | CineTix Admin</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/common/header.css">
  <link rel="stylesheet" href="../css/admin/admin.css">
  <link rel="stylesheet" href="../css/common/dark-mode.css">
  <script src="../js/common.js"></script>
  <script src="../js/admin/admin.js"></script>
</head>
<body>
  <div id="admin-nav-container"></div>

  <main class="admin-content">
    <div class="page-header">
      <div>
        <h1><i class="fas fa-tags"></i> Promotional Offers</h1>
        <p>Manage promo codes, discount amounts, categories, and expiration dates.</p>
      </div>
      <a href="add-offer.html" class="add-btn"><i class="fas fa-plus"></i> Add Offer</a>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Image</th>
            <th>Title &amp; Category</th>
            <th>Promo Code</th>
            <th>Discount</th>
            <th>Valid Until</th>
            <th>Badge</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="offers-tbody">
          <tr><td colspan="8" class="empty-state">Loading offers...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <script>
    async function loadOffers() {
      const tbody = document.getElementById('offers-tbody');
      const res = await AdminApp.apiFetch('/index.php/admin/offer/index');
      if (!res.success || !Array.isArray(res.data) || res.data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" class="empty-state">No promotional offers found.</td></tr>';
        return;
      }

      const esc = AdminApp.escapeHtml;
      tbody.innerHTML = res.data.map(function (o) {
        const imgSrc = AdminApp.resolveAdminAsset(o.img);
        const discount = '$' + (parseFloat(o.money) || 0).toFixed(2);
        const badgeHtml = o.badge ? '<span class="badge-tag">' + esc(o.badge) + '</span>' : '<span style="opacity:0.45;">—</span>';
        return (
          '<tr>' +
          '<td>#' + esc(o.offer_code) + '</td>' +
          '<td><img src="' + esc(imgSrc) + '" alt="' + esc(o.offer_title) + '" class="offer-img"></td>' +
          '<td><strong>' + esc(o.offer_title) + '</strong><br><small style="opacity:0.75;">' + esc(o.offer_type) + '</small></td>' +
          '<td><span class="promo-code">' + esc(o.promo_code) + '</span></td>' +
          '<td><strong>' + esc(discount) + '</strong></td>' +
          '<td>' + esc(o.offer_validity) + '</td>' +
          '<td>' + badgeHtml + '</td>' +
          '<td><div class="action-buttons">' +
          '<a href="edit-offer.html?offer_code=' + encodeURIComponent(o.offer_code) + '" class="edit-btn"><i class="fas fa-edit"></i> Edit</a>' +
          '<button type="button" class="delete-btn" data-id="' + esc(o.offer_code) + '"><i class="fas fa-trash"></i> Delete</button>' +
          '</div></td>' +
          '</tr>'
        );
      }).join('');

      tbody.querySelectorAll('.delete-btn').forEach(function (btn) {
        btn.addEventListener('click', async function () {
          const id = btn.getAttribute('data-id');
          if (!window.confirm('Delete offer #' + id + '?')) return;
          const delRes = await AdminApp.apiFetch('/index.php/admin/offer/delete?offer_code=' + encodeURIComponent(id), {
            method: 'POST',
            body: { offer_code: id },
          });
          if (delRes.success) {
            window.showToast('Offer deleted', 'success');
            loadOffers();
          } else {
            window.showToast(delRes.message || 'Delete failed', 'error');
          }
        });
      });
    }

    document.addEventListener('DOMContentLoaded', async function () {
      AdminApp.renderAdminNav('offers');
      if (!(await AdminApp.ensureAuthenticated())) return;
      loadOffers();
    });
  </script>
</body>
</html>
