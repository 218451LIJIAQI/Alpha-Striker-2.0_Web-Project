<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Offers | CineTix Admin</title>
  <link rel="stylesheet" href="../css/common/header.css">
  <link rel="stylesheet" href="../css/admin/admin.css">
  <script src="../js/common.js"></script>
  <script src="../js/admin/admin.js"></script>
</head>
<body>
  <div id="admin-nav-container"></div>

  <main class="admin-content">
    <div class="page-header">
      <div>
        <h1><i class="fas fa-tags" aria-hidden="true"></i> Promotional Offers</h1>
        <p>Manage promo codes, discount amounts, eligible movies, member ownership, and expiration dates.</p>
      </div>
      <a href="add-offer.html" class="add-btn"><i class="fas fa-plus" aria-hidden="true"></i> Add Offer</a>
    </div>

    <div class="table-container">
      <div class="admin-table-toolbar" id="offers-toolbar"></div>
      <table>
        <thead>
          <tr>
            <th class="check-col">
              <label class="sr-only" for="offers-check-all">Select all offers on page</label>
              <input type="checkbox" id="offers-check-all" data-role="check-all" aria-label="Select all offers on page">
            </th>
            <th>ID</th>
            <th>Image</th>
            <th>Title &amp; Category</th>
            <th>Promo Code</th>
            <th>Discount</th>
            <th>Scope</th>
            <th>Valid Until</th>
            <th>Badge</th>
            <th class="actions-col">Actions</th>
          </tr>
        </thead>
        <tbody id="offers-tbody">
          <tr><td colspan="10" class="empty-state">Loading offers...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', async function () {
      AdminApp.renderAdminNav('offers');
      if (!(await AdminApp.ensureAuthenticated())) return;

      const CT = window.CineTicket;
      const esc = AdminApp.escapeHtml;
      const todayIso = CT.todayIso();

      const tableCtrl = AdminApp.createTableController({
        endpoint: '/index.php/admin/offer/index',
        toolbarId: 'offers-toolbar',
        tbodyId: 'offers-tbody',
        colSpan: 10,
        emptyText: 'No promotional offers found.',
        searchPlaceholder: 'Search by title, promo code, category, or owner...',
        filters: [
          { value: 'all', label: 'All Offers' },
          { value: 'public', label: 'Public Offers' },
          { value: 'member', label: 'Member-Exclusive' },
          { value: 'active', label: 'Active Validity' },
          { value: 'expired', label: 'Expired' },
        ],
        sorts: [
          { key: 'id_asc', label: 'Sort: ID (Low–High)', compare: function (a, b) { return Number(a.offer_code) - Number(b.offer_code); } },
          { key: 'discount_desc', label: 'Sort: Discount (High–Low)', compare: function (a, b) { return (parseFloat(b.money) || 0) - (parseFloat(a.money) || 0); } },
          { key: 'validity_asc', label: 'Sort: Expiry (Soonest)', compare: function (a, b) { return String(a.offer_validity || '').localeCompare(String(b.offer_validity || '')); } },
        ],
        bulkAction: {
          label: 'Delete Selected',
          endpoint: '/index.php/admin/offer/delete',
          idKey: 'offer_code',
          batchKey: 'offer_codes',
          confirmText: function (n) { return 'Delete ' + n + ' selected offer(s)? Movie applicability links will also be removed.'; },
          successPrefix: 'Deleted',
        },
        deleteAction: {
          endpoint: '/index.php/admin/offer/delete',
          idKey: 'offer_code',
          confirmText: function (id) { return 'Delete offer #' + id + '? Movie applicability links will also be removed.'; },
          successText: 'Offer deleted',
        },
        exportCsv: {
          filename: 'cinetix-offers.csv',
          headers: ['ID', 'Title', 'Category', 'Promo Code', 'Discount ($)', 'Eligible Movies', 'Audience', 'Valid Until', 'Badge'],
          row: function (o) {
            const mCount = Array.isArray(o.movie_codes) ? o.movie_codes.length : (o.movie_count || 0);
            const ownerTxt = o.owner && o.owner.user_name ? o.owner.user_name : 'Public';
            return [o.offer_code, o.offer_title, o.offer_type, o.promo_code, (parseFloat(o.money) || 0).toFixed(2), mCount, ownerTxt, o.offer_validity, o.badge || ''];
          },
        },
        searchText: function (o) {
          const ownerTxt = o.owner && o.owner.user_name ? o.owner.user_name : 'public';
          return '#' + o.offer_code + ' ' + (o.offer_title || '') + ' ' + (o.promo_code || '') + ' ' + (o.offer_type || '') + ' ' + ownerTxt;
        },
        matchFilter: function (o, val) {
          const isExpired = Boolean(o.offer_validity && String(o.offer_validity) < todayIso);
          if (val === 'public') return !o.user_code;
          if (val === 'member') return Boolean(o.user_code);
          if (val === 'active') return !isExpired;
          if (val === 'expired') return isExpired;
          return true;
        },
        renderRow: function (o) {
          const imgSrc = CT.resolveAssetUrl(o.img);
          const discount = '$' + (parseFloat(o.money) || 0).toFixed(2);
          const mCount = Array.isArray(o.movie_codes) ? o.movie_codes.length : (o.movie_count || 0);
          const ownerTxt = o.owner && o.owner.user_name ? ('User: ' + o.owner.user_name) : 'Public';
          const badgeHtml = o.badge ? '<span class="badge-tag">' + esc(o.badge) + '</span>' : '<span class="muted-dash">—</span>';
          const isExpired = Boolean(o.offer_validity && String(o.offer_validity) < todayIso);
          return (
            '<tr>' +
            '<td class="check-col"><label><span class="sr-only">Select offer #' + esc(o.offer_code) + '</span><input type="checkbox" class="row-check" value="' + esc(o.offer_code) + '" aria-label="Select offer #' + esc(o.offer_code) + '"></label></td>' +
            '<td class="tabular-nums">#' + esc(o.offer_code) + '</td>' +
            '<td><img src="' + esc(imgSrc) + '" alt="' + esc(o.offer_title) + '" class="offer-img"></td>' +
            '<td><strong>' + esc(o.offer_title) + '</strong><br><small class="sub-meta">' + esc(o.offer_type) + '</small></td>' +
            '<td><span class="promo-code">' + esc(o.promo_code) + '</span></td>' +
            '<td class="tabular-nums"><strong>' + esc(discount) + '</strong></td>' +
            '<td><span class="scope-badge tabular-nums">' + esc(mCount + ' movie' + (mCount === 1 ? '' : 's')) + '</span><br><small class="sub-meta">' + esc(ownerTxt) + '</small></td>' +
            '<td class="tabular-nums">' + esc(o.offer_validity) + (isExpired ? ' <small class="expired-pill">Expired</small>' : '') + '</td>' +
            '<td>' + badgeHtml + '</td>' +
            '<td class="actions-col"><div class="action-buttons">' +
            '<a href="edit-offer.html?offer_code=' + encodeURIComponent(o.offer_code) + '" class="edit-btn"><i class="fas fa-edit" aria-hidden="true"></i> Edit</a>' +
            '<button type="button" class="delete-btn" data-id="' + esc(o.offer_code) + '"><i class="fas fa-trash" aria-hidden="true"></i> Delete</button>' +
            '</div></td>' +
            '</tr>'
          );
        },
      });

      tableCtrl.reload();
    });
  </script>
</body>
</html>
