<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Movie | CineTix Admin</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/common/header.css">
  <link rel="stylesheet" href="../css/admin/admin.css">
  <link rel="stylesheet" href="../css/common/dark-mode.css">
  <script src="../js/common.js"></script>
  <script src="../js/admin/admin.js"></script>
</head>
<body>
  <div id="admin-nav-container"></div>

  <main class="admin-content narrow">
    <div class="page-header">
      <div>
        <h1><i class="fas fa-plus-circle"></i> Add New Movie</h1>
        <p>Enter movie metadata, pricing, and poster path.</p>
      </div>
    </div>

    <form id="add-movie-form" class="form-container">
      <div class="form-grid">
        <div class="form-group full-width">
          <label for="movie_name" class="form-label">Movie Title *</label>
          <input type="text" id="movie_name" name="movie_name" class="form-input" placeholder="e.g. Dune: Part Two" required maxlength="200">
        </div>

        <div class="form-group">
          <label for="movie_type" class="form-label">Primary Genre *</label>
          <select id="movie_type" name="movie_type" class="form-input" required>
            <option value="Action">Action</option>
            <option value="Adventure">Adventure</option>
            <option value="Animation">Animation</option>
            <option value="Drama">Drama</option>
            <option value="Sci-Fi">Sci-Fi</option>
            <option value="Mystery">Mystery</option>
            <option value="Comedy">Comedy</option>
            <option value="Horror">Horror</option>
          </select>
        </div>

        <div class="form-group">
          <label for="times" class="form-label">Duration *</label>
          <input type="text" id="times" name="times" class="form-input" placeholder="e.g. 2h 15m" required maxlength="50">
        </div>

        <div class="form-group">
          <label for="star" class="form-label">Rating (0.0 – 5.0) *</label>
          <input type="number" id="star" name="star" class="form-input" step="0.1" min="0" max="5" value="4.8" required>
        </div>

        <div class="form-group">
          <label for="money" class="form-label">Ticket Price ($) *</label>
          <input type="number" id="money" name="money" class="form-input" step="0.01" min="0" value="39.00" required>
        </div>

        <div class="form-group">
          <label for="tag" class="form-label">Highlight Badge (Optional)</label>
          <input type="text" id="tag" name="tag" class="form-input" placeholder="e.g. FEATURED, NEW, IMAX" maxlength="50">
        </div>

        <div class="form-group">
          <label for="img" class="form-label">Poster Path or URL *</label>
          <input type="text" id="img" name="img" class="form-input" placeholder="../img/homepage/frozen_2.jpeg" required maxlength="500">
          <div class="preview-container">
            <img id="poster-preview" class="preview-img" alt="Poster Preview">
          </div>
        </div>
      </div>

      <div class="form-actions">
        <a href="movies.html" class="cancel-btn">Cancel</a>
        <button type="submit" class="submit-btn"><i class="fas fa-save"></i> Create Movie</button>
      </div>
    </form>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', async function () {
      AdminApp.renderAdminNav('movies');
      if (!(await AdminApp.ensureAuthenticated())) return;

      const imgInput = document.getElementById('img');
      const preview = document.getElementById('poster-preview');
      imgInput.addEventListener('change', function () {
        const val = imgInput.value.trim();
        if (/\.(jpe?g|png|webp|gif|svg)(\?.*)?$/i.test(val) || val.startsWith("data:")) {
          preview.src = AdminApp.resolveAdminAsset(val);
          preview.style.display = 'block';
        } else {
          preview.style.display = 'none';
        }
      });

      document.getElementById('add-movie-form').addEventListener('submit', async function (e) {
        e.preventDefault();
        const payload = {
          movie_name: document.getElementById('movie_name').value.trim(),
          movie_type: document.getElementById('movie_type').value,
          times: document.getElementById('times').value.trim(),
          star: document.getElementById('star').value,
          money: document.getElementById('money').value,
          tag: document.getElementById('tag').value.trim(),
          img: document.getElementById('img').value.trim(),
        };

        const res = await AdminApp.apiFetch('/index.php/admin/movie/create', {
          method: 'POST',
          body: payload,
        });
        if (res.success) {
          window.showToast('Movie created successfully', 'success');
          setTimeout(function () { window.location.href = 'movies.html'; }, 500);
        } else {
          window.showToast(res.message || 'Failed to create movie', 'error');
        }
      });
    });
  </script>
</body>
</html>
