<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seat Bookings | CineTix Admin</title>
  <link rel="stylesheet" href="../css/common/header.css">
  <link rel="stylesheet" href="../css/admin/admin.css">
  <script src="../js/common.js"></script>
  <script src="../js/admin/admin.js"></script>
</head>
<body>
  <div id="admin-nav-container"></div>

  <main class="admin-content">
    <div class="page-header">
      <div>
        <h1><i class="fas fa-chair" aria-hidden="true"></i> Seat Reservations</h1>
        <p>Inspect reserved seats across all screenings and process individual or batch cancellations.</p>
      </div>
    </div>

    <div class="table-container">
      <div class="admin-table-toolbar" id="seats-toolbar"></div>
      <table>
        <thead>
          <tr>
            <th class="check-col">
              <label class="sr-only" for="seats-check-all">Select all reservations on page</label>
              <input type="checkbox" id="seats-check-all" data-role="check-all" aria-label="Select all reservations on page">
            </th>
            <th>Booking ID</th>
            <th>Movie</th>
            <th>Theater</th>
            <th>Customer</th>
            <th>Date &amp; Time</th>
            <th>Seat</th>
            <th>Zone</th>
            <th class="actions-col">Actions</th>
          </tr>
        </thead>
        <tbody id="seats-tbody">
          <tr><td colspan="9" class="empty-state">Loading reservations...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', async function () {
      AdminApp.renderAdminNav('seats');
      if (!(await AdminApp.ensureAuthenticated())) return;

      const CT = window.CineTicket;
      const esc = AdminApp.escapeHtml;
      const tableCtrl = AdminApp.createTableController({
        endpoint: '/index.php/admin/seat/index',
        toolbarId: 'seats-toolbar',
        tbodyId: 'seats-tbody',
        colSpan: 9,
        emptyText: 'No seat reservations found.',
        searchPlaceholder: 'Search by booking ID, movie, theater, customer, date, or seat...',
        filters: [
          { value: 'all', label: 'All Zones & Guests' },
          { value: 'vip', label: 'Prime VIP Seats' },
          { value: 'std', label: 'Standard Seats' },
          { value: 'member', label: 'Registered Members' },
          { value: 'guest', label: 'Guest Checkouts' },
        ],
        sorts: [
          { key: 'id_desc', label: 'Sort: Newest Booking', compare: function (a, b) { return Number(b.seat_code) - Number(a.seat_code); } },
          {
            key: 'date_asc',
            label: 'Sort: Screening Date',
            compare: function (a, b) {
              const da = String(a.date || '');
              const db = String(b.date || '');
              if (da !== db) return da.localeCompare(db);
              const ma = CT.parseScreeningMinutes(a.time);
              const mb = CT.parseScreeningMinutes(b.time);
              if (ma !== mb) return ma - mb;
              return Number(a.seat_code) - Number(b.seat_code);
            },
          },
          {
            key: 'seat_asc',
            label: 'Sort: Seat Code',
            compare: function (a, b) { return CT.compareSeatCodes(a.seat_num, b.seat_num); },
          },
        ],
        bulkAction: {
          label: 'Cancel Selected',
          endpoint: '/index.php/admin/seat/delete',
          idKey: 'seat_code',
          batchKey: 'seat_codes',
          confirmText: function (n) { return 'Cancel ' + n + ' selected seat reservation(s) and release seats back to inventory?'; },
          successPrefix: 'Cancelled',
        },
        deleteAction: {
          selector: '.refund-btn',
          endpoint: '/index.php/admin/seat/delete',
          idKey: 'seat_code',
          confirmText: function (id) { return 'Cancel seat reservation #' + id + '?'; },
          successText: function (id) { return 'Reservation #' + id + ' cancelled'; },
        },
        exportCsv: {
          filename: 'cinetix-seat-bookings.csv',
          headers: ['Booking ID', 'Movie', 'Theater', 'Date', 'Time', 'Seat', 'Zone', 'Customer', 'Email', 'Created At'],
          row: function (s) {
            const movieTitle = (s.movie && s.movie.movie_name) ? s.movie.movie_name : ('Movie #' + s.movie_code);
            const theaterName = (s.theater && s.theater.theater_name) ? s.theater.theater_name : ('Theater #' + (s.theater_code || 1));
            const userName = (s.user && s.user.user_name) ? s.user.user_name : 'Guest Checkout';
            const userEmail = (s.user && s.user.email) ? s.user.email : '';
            return [
              s.seat_code,
              movieTitle,
              theaterName,
              s.date || '',
              s.time || '',
              s.seat_num || '',
              Number(s.seat_zone) === 2 ? 'Prime VIP' : 'Standard',
              userName,
              userEmail,
              s.create_time || '',
            ];
          },
        },
        searchText: function (s) {
          const m = (s.movie && s.movie.movie_name) || ('Movie #' + s.movie_code);
          const t = (s.theater && s.theater.theater_name) || ('Theater #' + (s.theater_code || 1));
          const u = (s.user && s.user.user_name) ? (s.user.user_name + ' ' + (s.user.email || '')) : 'guest';
          return '#' + s.seat_code + ' ' + m + ' ' + t + ' ' + u + ' ' + (s.date || '') + ' ' + (s.time || '') + ' ' + (s.seat_num || '');
        },
        matchFilter: function (s, val) {
          if (val === 'vip') return Number(s.seat_zone) === 2;
          if (val === 'std') return Number(s.seat_zone) !== 2;
          if (val === 'member') return Boolean(s.user && s.user.user_name);
          if (val === 'guest') return !(s.user && s.user.user_name);
          return true;
        },
        renderRow: function (s) {
          const movieTitle = (s.movie && s.movie.movie_name) ? s.movie.movie_name : ('Movie #' + s.movie_code);
          const theaterName = (s.theater && s.theater.theater_name) ? s.theater.theater_name : ('Theater #' + (s.theater_code || 1));
          const userName = (s.user && s.user.user_name) ? (s.user.user_name + ' (' + (s.user.email || '') + ')') : 'Guest Checkout';
          const isVip = Number(s.seat_zone) === 2;
          return (
            '<tr>' +
            '<td class="check-col"><label><span class="sr-only">Select booking #' + esc(s.seat_code) + '</span><input type="checkbox" class="row-check" value="' + esc(s.seat_code) + '" aria-label="Select booking #' + esc(s.seat_code) + '"></label></td>' +
            '<td class="tabular-nums">#' + esc(s.seat_code) + '</td>' +
            '<td><strong>' + esc(movieTitle) + '</strong></td>' +
            '<td>' + esc(theaterName) + '</td>' +
            '<td>' + esc(userName) + '</td>' +
            '<td class="tabular-nums">' + esc(s.date) + ' &bull; ' + esc(s.time) + '</td>' +
            '<td><span class="seat-number tabular-nums">' + esc(s.seat_num) + '</span></td>' +
            '<td>' + (isVip ? '<span class="tag-badge">VIP</span>' : '<span class="scope-badge">Standard</span>') + '</td>' +
            '<td class="actions-col"><button type="button" class="refund-btn" data-id="' + esc(s.seat_code) + '"><i class="fas fa-undo" aria-hidden="true"></i> Cancel</button></td>' +
            '</tr>'
          );
        },
      });

      tableCtrl.reload();
    });
  </script>
</body>
</html>
