<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seat Bookings | CineTix Admin</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/common/header.css">
  <link rel="stylesheet" href="../css/admin/admin.css">
  <script src="../js/common.js"></script>
  <script src="../js/admin/admin.js"></script>
</head>
<body>
  <div id="admin-nav-container"></div>

  <main class="admin-content">
    <div class="page-header">
      <div>
        <h1><i class="fas fa-chair"></i> Seat Reservations</h1>
        <p>Inspect reserved seats across all screenings and process administrative cancellations.</p>
      </div>
      <input type="search" id="seat-filter-input" class="form-input" style="max-width:280px;" placeholder="Filter by movie, theater, customer, seat...">
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Booking ID</th>
            <th>Movie</th>
            <th>Theater</th>
            <th>Customer</th>
            <th>Date &amp; Time</th>
            <th>Seat</th>
            <th>Zone</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="seats-tbody">
          <tr><td colspan="8" class="empty-state">Loading reservations...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <script>
    let allSeats = [];

    function renderSeatRows(rows) {
      const tbody = document.getElementById('seats-tbody');
      if (!rows.length) {
        AdminApp.renderTableState(tbody, 8, 'empty', 'No matching seat reservations found.');
        return;
      }

      const esc = AdminApp.escapeHtml;
      tbody.innerHTML = rows.map(function (s) {
        const movieTitle = (s.movie && s.movie.movie_name) ? s.movie.movie_name : ('Movie #' + s.movie_code);
        const theaterName = (s.theater && s.theater.theater_name) ? s.theater.theater_name : ('Theater #' + (s.theater_code || 1));
        const userName = (s.user && s.user.user_name) ? (s.user.user_name + ' (' + (s.user.email || '') + ')') : 'Guest Checkout';
        const zoneLabel = Number(s.seat_zone) === 2 ? 'VIP' : 'Standard';
        return (
          '<tr>' +
          '<td>#' + esc(s.seat_code) + '</td>' +
          '<td><strong>' + esc(movieTitle) + '</strong></td>' +
          '<td>' + esc(theaterName) + '</td>' +
          '<td>' + esc(userName) + '</td>' +
          '<td>' + esc(s.date) + ' &bull; ' + esc(s.time) + '</td>' +
          '<td><span class="seat-number">' + esc(s.seat_num) + '</span></td>' +
          '<td>' + esc(zoneLabel) + '</td>' +
          '<td><button type="button" class="refund-btn" data-id="' + esc(s.seat_code) + '"><i class="fas fa-undo"></i> Cancel</button></td>' +
          '</tr>'
        );
      }).join('');

      AdminApp.bindDeleteActions(tbody, {
        selector: '.refund-btn',
        endpoint: '/index.php/admin/seat/delete',
        idKey: 'seat_code',
        confirmText: function (id) { return 'Cancel seat reservation #' + id + '?'; },
        successText: function (id) { return 'Reservation #' + id + ' cancelled'; },
        onSuccess: loadSeats,
      });
    }

    function applySeatFilter() {
      const q = (document.getElementById('seat-filter-input')?.value || '').trim().toLowerCase();
      if (!q) {
        renderSeatRows(allSeats);
        return;
      }
      renderSeatRows(allSeats.filter(function (s) {
        const hay = [
          s.seat_code,
          s.movie && s.movie.movie_name,
          s.theater && s.theater.theater_name,
          s.user ? (s.user.user_name + ' ' + s.user.email) : 'Guest Checkout',
          s.date,
          s.time,
          s.seat_num,
        ].join(' ').toLowerCase();
        return hay.includes(q);
      }));
    }

    async function loadSeats() {
      const tbody = document.getElementById('seats-tbody');
      AdminApp.renderTableState(tbody, 8, 'loading', 'Loading reservations...');

      try {
        const res = await AdminApp.apiFetch('/index.php/admin/seat/index');
        if (!res.success) {
          AdminApp.renderTableState(tbody, 8, 'error', res.message || 'Failed to load seat bookings.', loadSeats);
          return;
        }
        allSeats = Array.isArray(res.data) ? res.data : [];
        if (!allSeats.length) {
          AdminApp.renderTableState(tbody, 8, 'empty', 'No seat reservations found.');
          return;
        }
        applySeatFilter();
      } catch (_) {
        AdminApp.renderTableState(tbody, 8, 'error', 'Network error while loading seat bookings.', loadSeats);
      }
    }

    document.addEventListener('DOMContentLoaded', async function () {
      AdminApp.renderAdminNav('seats');
      if (!(await AdminApp.ensureAuthenticated())) return;
      document.getElementById('seat-filter-input')?.addEventListener('input', applySeatFilter);
      loadSeats();
    });
  </script>
</body>
</html>
