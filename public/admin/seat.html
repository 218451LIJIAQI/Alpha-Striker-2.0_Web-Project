<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seat Bookings | CineTix Admin</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/common/header.css">
  <link rel="stylesheet" href="../css/admin/admin.css">
  <link rel="stylesheet" href="../css/common/dark-mode.css">
  <script src="../js/common.js"></script>
  <script src="../js/admin/admin.js"></script>
</head>
<body>
  <div id="admin-nav-container"></div>

  <main class="admin-content">
    <div class="page-header">
      <div>
        <h1><i class="fas fa-chair"></i> Seat Reservations</h1>
        <p>Inspect reserved seats across all screenings and process administrative cancellations.</p>
      </div>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Booking ID</th>
            <th>Movie</th>
            <th>Theater</th>
            <th>Customer</th>
            <th>Date &amp; Time</th>
            <th>Seat</th>
            <th>Zone</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="seats-tbody">
          <tr><td colspan="8" class="empty-state">Loading reservations...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <script>
    async function loadSeats() {
      const tbody = document.getElementById('seats-tbody');
      const res = await AdminApp.apiFetch('/index.php/admin/seat/index');
      if (!res.success || !Array.isArray(res.data) || res.data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" class="empty-state">No seat reservations found.</td></tr>';
        return;
      }

      const esc = AdminApp.escapeHtml;
      tbody.innerHTML = res.data.map(function (s) {
        const movieTitle = (s.movie && s.movie.movie_name) ? s.movie.movie_name : ('Movie #' + s.movie_code);
        const theaterName = (s.theater && s.theater.theater_name) ? s.theater.theater_name : ('Theater #' + (s.theater_code || 1));
        const userName = (s.user && s.user.user_name) ? (s.user.user_name + ' (' + (s.user.email || '') + ')') : 'Guest Checkout';
        const zoneLabel = Number(s.seat_zone) === 2 ? 'VIP' : 'Standard';
        return (
          '<tr>' +
          '<td>#' + esc(s.seat_code) + '</td>' +
          '<td><strong>' + esc(movieTitle) + '</strong></td>' +
          '<td>' + esc(theaterName) + '</td>' +
          '<td>' + esc(userName) + '</td>' +
          '<td>' + esc(s.date) + ' &bull; ' + esc(s.time) + '</td>' +
          '<td><span class="seat-number">' + esc(s.seat_num) + '</span></td>' +
          '<td>' + esc(zoneLabel) + '</td>' +
          '<td><button type="button" class="refund-btn" data-id="' + esc(s.seat_code) + '"><i class="fas fa-undo"></i> Cancel</button></td>' +
          '</tr>'
        );
      }).join('');

      tbody.querySelectorAll('.refund-btn').forEach(function (btn) {
        btn.addEventListener('click', async function () {
          const id = btn.getAttribute('data-id');
          if (!window.confirm('Cancel seat reservation #' + id + '?')) return;
          const delRes = await AdminApp.apiFetch('/index.php/admin/seat/delete?seat_code=' + encodeURIComponent(id), {
            method: 'POST',
            body: { seat_code: id },
          });
          if (delRes.success) {
            window.showToast('Reservation #' + id + ' cancelled', 'success');
            loadSeats();
          } else {
            window.showToast(delRes.message || 'Cancellation failed', 'error');
          }
        });
      });
    }

    document.addEventListener('DOMContentLoaded', async function () {
      AdminApp.renderAdminNav('seats');
      if (!(await AdminApp.ensureAuthenticated())) return;
      loadSeats();
    });
  </script>
</body>
</html>
