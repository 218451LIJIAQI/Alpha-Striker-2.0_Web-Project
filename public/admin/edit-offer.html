<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Offer | CineTix Admin</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/common/header.css">
  <link rel="stylesheet" href="../css/admin/admin.css">
  <script src="../js/common.js"></script>
  <script src="../js/admin/admin.js"></script>
</head>
<body>
  <div id="admin-nav-container"></div>

  <main class="admin-content narrow">
    <div class="page-header">
      <div>
        <h1><i class="fas fa-edit"></i> Edit Promotional Offer</h1>
        <p>Update promo code, discount value, category, eligible movies, or validity date.</p>
      </div>
    </div>

    <form id="edit-offer-form" class="form-container">
      <div class="form-grid">
        <div class="form-group full-width">
          <label for="offer_title" class="form-label">Offer Title *</label>
          <input type="text" id="offer_title" name="offer_title" class="form-input" required maxlength="200">
        </div>

        <div class="form-group">
          <label for="offer_type" class="form-label">Category *</label>
          <select id="offer_type" name="offer_type" class="form-input" required>
            <option value="Student Deals">Student Deals</option>
            <option value="Weekday Specials">Weekday Specials</option>
            <option value="Food & Beverage">Food &amp; Beverage</option>
            <option value="VIP Experiences">VIP Experiences</option>
          </select>
        </div>

        <div class="form-group">
          <label for="promo_code" class="form-label">Promo Code *</label>
          <input type="text" id="promo_code" name="promo_code" class="form-input" required maxlength="50" style="text-transform:uppercase;">
        </div>

        <div class="form-group">
          <label for="money" class="form-label">Discount Amount ($) *</label>
          <input type="number" id="money" name="money" class="form-input" step="0.01" min="0.01" max="9999.99" required>
        </div>

        <div class="form-group">
          <label for="offer_validity" class="form-label">Valid Until (YYYY-MM-DD) *</label>
          <input type="date" id="offer_validity" name="offer_validity" class="form-input" required>
        </div>

        <div class="form-group">
          <label for="badge" class="form-label">Highlight Badge (Optional)</label>
          <input type="text" id="badge" name="badge" class="form-input" maxlength="50">
        </div>

        <div class="form-group full-width">
          <label for="img" class="form-label">Image Path or URL *</label>
          <input type="text" id="img" name="img" class="form-input" required maxlength="500">
          <div class="preview-container">
            <img id="offer-preview" class="preview-img" alt="Offer Preview">
          </div>
        </div>

        <div class="form-group full-width">
          <label for="offer_description" class="form-label">Description *</label>
          <textarea id="offer_description" name="offer_description" class="form-input" required maxlength="500"></textarea>
        </div>

        <div class="form-group full-width">
          <label class="form-label">Eligible Movies *</label>
          <div id="movie-checklist"></div>
        </div>
      </div>

      <div class="form-actions">
        <a href="offers.html" class="cancel-btn">Cancel</a>
        <button type="submit" class="submit-btn"><i class="fas fa-save"></i> Save Changes</button>
      </div>
    </form>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', async function () {
      AdminApp.renderAdminNav('offers');
      if (!(await AdminApp.ensureAuthenticated())) return;

      const offerCode = new URLSearchParams(window.location.search).get('offer_code');
      if (!offerCode) {
        window.location.href = 'offers.html';
        return;
      }

      const imgInput = document.getElementById('img');
      const syncPreview = AdminApp.bindImagePreview(imgInput, document.getElementById('offer-preview'));
      const checklistEl = document.getElementById('movie-checklist');

      const [detailRes, moviesRes] = await Promise.all([
        AdminApp.apiFetch('/index.php/admin/offer/getOfferByCode?offer_code=' + encodeURIComponent(offerCode)),
        AdminApp.apiFetch('/index.php/admin/movie/index'),
      ]);

      if (!detailRes.success || !detailRes.data) {
        window.showToast(detailRes.message || 'Offer not found', 'error');
        setTimeout(function () { window.location.href = 'offers.html'; }, 700);
        return;
      }

      const o = detailRes.data;
      document.getElementById('offer_title').value = o.offer_title || '';
      document.getElementById('offer_type').value = o.offer_type || 'Student Deals';
      document.getElementById('promo_code').value = o.promo_code || '';
      document.getElementById('money').value = o.money !== undefined ? o.money : '5.00';
      document.getElementById('offer_validity').value = o.offer_validity || '';
      document.getElementById('badge').value = o.badge || '';
      imgInput.value = o.img || '';
      document.getElementById('offer_description').value = o.offer_description || '';
      syncPreview();

      const movies = moviesRes.success && Array.isArray(moviesRes.data) ? moviesRes.data : [];
      AdminApp.renderRelationChecklist(checklistEl, movies, 'movie_code', 'movie_name', o.movie_codes || [], 'movie_codes');

      document.getElementById('edit-offer-form').addEventListener('submit', function (e) {
        e.preventDefault();
        const checkedMovies = AdminApp.getCheckedIds(checklistEl, 'movie_codes');
        if (movies.length > 0 && checkedMovies.length === 0) {
          window.showToast('Please select at least one eligible movie', 'warning');
          return;
        }
        AdminApp.submitForm('/index.php/admin/offer/update', {
          offer_code: offerCode,
          offer_title: document.getElementById('offer_title').value.trim(),
          offer_type: document.getElementById('offer_type').value,
          promo_code: document.getElementById('promo_code').value.trim().toUpperCase(),
          money: document.getElementById('money').value,
          offer_validity: document.getElementById('offer_validity').value,
          badge: document.getElementById('badge').value.trim(),
          img: imgInput.value.trim(),
          offer_description: document.getElementById('offer_description').value.trim(),
          movie_codes: checkedMovies,
        }, 'offers.html', 'Offer updated successfully', 'Failed to update offer');
      });
    });
  </script>
</body>
</html>
