<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Offer | CineTix Admin</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/common/header.css">
  <link rel="stylesheet" href="../css/admin/admin.css">
  <script src="../js/common.js"></script>
  <script src="../js/admin/admin.js"></script>
</head>
<body>
  <div id="admin-nav-container"></div>

  <main class="admin-content narrow">
    <div class="page-header">
      <div>
        <h1><i class="fas fa-plus-circle"></i> Create Promotional Offer</h1>
        <p>Configure promo code, discount value, category, and expiration date.</p>
      </div>
    </div>

    <form id="add-offer-form" class="form-container">
      <div class="form-grid">
        <div class="form-group full-width">
          <label for="offer_title" class="form-label">Offer Title *</label>
          <input type="text" id="offer_title" name="offer_title" class="form-input" placeholder="e.g. Weekend Blockbuster Saver" required maxlength="200">
        </div>

        <div class="form-group">
          <label for="offer_type" class="form-label">Category *</label>
          <select id="offer_type" name="offer_type" class="form-input" required>
            <option value="Student Deals">Student Deals</option>
            <option value="Weekday Specials">Weekday Specials</option>
            <option value="Food & Beverage">Food &amp; Beverage</option>
            <option value="VIP Experiences">VIP Experiences</option>
          </select>
        </div>

        <div class="form-group">
          <label for="promo_code" class="form-label">Promo Code *</label>
          <input type="text" id="promo_code" name="promo_code" class="form-input" placeholder="e.g. WEEKEND10" required maxlength="100" style="text-transform:uppercase;">
        </div>

        <div class="form-group">
          <label for="money" class="form-label">Discount Amount ($) *</label>
          <input type="number" id="money" name="money" class="form-input" step="0.01" min="0" value="5.00" required>
        </div>

        <div class="form-group">
          <label for="offer_validity" class="form-label">Valid Until (YYYY-MM-DD) *</label>
          <input type="date" id="offer_validity" name="offer_validity" class="form-input" value="2027-12-31" required>
        </div>

        <div class="form-group">
          <label for="badge" class="form-label">Highlight Badge (Optional)</label>
          <input type="text" id="badge" name="badge" class="form-input" placeholder="e.g. EXCLUSIVE, POPULAR" maxlength="50">
        </div>

        <div class="form-group">
          <label for="img" class="form-label">Image Path or URL *</label>
          <input type="text" id="img" name="img" class="form-input" placeholder="../img/offer/student_price.png" required maxlength="500">
        </div>

        <div class="form-group full-width">
          <label for="offer_description" class="form-label">Description *</label>
          <textarea id="offer_description" name="offer_description" class="form-input" placeholder="Explain how customers redeem this offer..." required maxlength="500"></textarea>
        </div>
      </div>

      <div class="form-actions">
        <a href="offers.html" class="cancel-btn">Cancel</a>
        <button type="submit" class="submit-btn"><i class="fas fa-save"></i> Create Offer</button>
      </div>
    </form>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', async function () {
      AdminApp.renderAdminNav('offers');
      if (!(await AdminApp.ensureAuthenticated())) return;

      document.getElementById('add-offer-form').addEventListener('submit', function (e) {
        e.preventDefault();
        AdminApp.submitForm('/index.php/admin/offer/create', {
          offer_title: document.getElementById('offer_title').value.trim(),
          offer_type: document.getElementById('offer_type').value,
          promo_code: document.getElementById('promo_code').value.trim().toUpperCase(),
          money: document.getElementById('money').value,
          offer_validity: document.getElementById('offer_validity').value,
          badge: document.getElementById('badge').value.trim(),
          img: document.getElementById('img').value.trim(),
          offer_description: document.getElementById('offer_description').value.trim(),
        }, 'offers.html', 'Offer created successfully', 'Failed to create offer');
      });
    });
  </script>
</body>
</html>
