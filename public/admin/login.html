<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Alpha Striker 2.0</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/common/header.css">
  <link rel="stylesheet" href="../css/login/login.css">
  <link rel="stylesheet" href="../css/common/dark-mode.css">
  <script src="../js/common.js"></script>
  <script src="../js/admin/admin.js"></script>
  <style>
    .admin-logo-section img {
      width: 84px;
      height: 84px;
      object-fit: cover;
      border-radius: 12px;
      margin-bottom: 10px;
    }
    .admin-branding h1 {
      font-size: 28px;
      font-weight: 700;
      color: #4361ee;
      margin-bottom: 4px;
    }
  </style>
</head>
<body>
  <div id="admin-login-page">
    <div class="container">
      <div class="logo-section admin-logo-section">
        <img src="../img/logo.jpg" alt="CineTix Admin">
        <div class="admin-branding">
          <h1>CineTix Admin Console</h1>
        </div>
        <p>Administrative Management Portal</p>
      </div>

      <div class="auth-container card admin-container">
        <div class="auth-header admin-header">
          <h1>Administrator Sign In</h1>
          <p>Enter your administrator credentials to manage catalog &amp; bookings</p>
        </div>

        <form id="admin-login-form">
          <div class="form-group">
            <label for="admin-username" class="form-label">Username</label>
            <input type="text" id="admin-username" name="username" class="form-input" placeholder="Enter admin username" required autocomplete="username">
          </div>

          <div class="form-group">
            <label for="admin-password" class="form-label">Password</label>
            <input type="password" id="admin-password" name="password" class="form-input" placeholder="Enter admin password" required autocomplete="current-password">
          </div>

          <button type="submit" class="btn btn-primary" id="admin-submit-btn">Sign In to Admin Panel</button>
        </form>

        <div class="auth-footer">
          <p>Authorized personnel only &bull; <a href="../login.html" class="auth-link">Customer Sign In</a></p>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('admin-login-form').addEventListener('submit', async function (e) {
      e.preventDefault();
      const username = document.getElementById('admin-username').value.trim();
      const password = document.getElementById('admin-password').value;
      const btn = document.getElementById('admin-submit-btn');

      if (!username || !password) {
        window.showToast('Username and password are required', 'warning');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Signing in...';

      try {
        const res = await fetch('/index.php/admin/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ username: username, password: password }),
        });
        const payload = await res.json();

        if (payload.success && payload.token) {
          localStorage.setItem('adminToken', payload.token);
          localStorage.setItem('adminUser', (payload.data && payload.data.username) || username);
          window.location.href = 'dashboard.html';
          return;
        }
        window.showToast(payload.message || 'Invalid credentials', 'error');
      } catch (_) {
        window.showToast('Unable to reach authentication service', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Sign In to Admin Panel';
      }
    });
  </script>
</body>
</html>
