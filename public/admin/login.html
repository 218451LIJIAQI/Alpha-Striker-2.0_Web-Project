<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | CineTix Console</title>
  <link rel="stylesheet" href="../css/common/header.css">
  <link rel="stylesheet" href="../css/login/login.css">
  <script src="../js/common.js"></script>
  <script src="../js/admin/admin.js"></script>
</head>
<body>
  <div class="auth-topbar">
    <a href="../pages/homepage.html" class="auth-back-link">&larr; Back to Box Office</a>
    <button type="button" class="dark-mode-toggle" data-theme-toggle title="Toggle Dark Mode" aria-label="Toggle Dark Mode"></button>
  </div>

  <main id="admin-login-page" class="auth-shell">
    <div class="container">
      <div class="logo-section admin-logo-section">
        <a href="../pages/homepage.html" class="logo-brand-link">
          <img src="../img/logo.jpg" alt="CineTix Admin">
        </a>
        <div class="admin-branding">
          <h1>CineTix Admin Console</h1>
        </div>
        <p>Theater Operations &amp; Box-Office Management</p>
      </div>

      <div class="auth-container card admin-container">
        <div class="auth-header">
          <h2>Administrator Sign In</h2>
          <p>Enter your administrator credentials to manage catalog, schedules &amp; bookings</p>
        </div>

        <form id="admin-login-form" novalidate>
          <div class="form-group">
            <label for="admin-username" class="form-label">Username *</label>
            <input type="text" id="admin-username" name="username" class="form-input" placeholder="Enter admin username" required maxlength="64" autocomplete="username">
          </div>

          <div class="form-group">
            <label for="admin-password" class="form-label">Password *</label>
            <input type="password" id="admin-password" name="password" class="form-input" placeholder="Enter admin password" required maxlength="72" autocomplete="current-password">
          </div>

          <button type="submit" class="btn btn-primary" id="admin-submit-btn">Sign In to Admin Panel</button>
        </form>

        <div class="auth-footer">
          <p>Authorized personnel only &bull; <a href="../login.html" class="auth-link">Customer Sign In</a></p>
        </div>
      </div>
    </div>
  </main>

  <script>
    document.getElementById('admin-login-form').addEventListener('submit', async function (e) {
      e.preventDefault();
      const CT = window.CineTicket;
      const userEl = document.getElementById('admin-username');
      const pwdEl = document.getElementById('admin-password');
      const username = userEl.value.trim();
      const password = pwdEl.value;
      const btn = document.getElementById('admin-submit-btn');
      if (btn.disabled) return;

      [userEl, pwdEl].forEach(CT.clearFieldError);

      if (!username) {
        CT.flagFieldError(userEl, 'Admin username is required');
        window.showToast('Username and password are required', 'warning');
        return;
      }
      if (!password) {
        CT.flagFieldError(pwdEl, 'Admin password is required');
        window.showToast('Username and password are required', 'warning');
        return;
      }
      if (CT.utf8ByteLength(password) > 72) {
        CT.flagFieldError(pwdEl, 'Password exceeds maximum 72-byte length');
        window.showToast('Password exceeds maximum 72-byte length', 'warning');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Signing in...';

      try {
        const payload = await AdminApp.apiFetch('/index.php/admin/auth/login', {
          method: 'POST',
          body: { username: username, password: password },
        });
        if (payload.success && payload.token) {
          localStorage.setItem('adminToken', payload.token);
          localStorage.setItem('adminUser', (payload.data && payload.data.username) || username);
          window.location.href = 'dashboard.html';
          return;
        }
        CT.flagFieldError(pwdEl, payload.message || 'Invalid credentials');
        window.showToast(payload.message || 'Invalid credentials', 'error');
      } catch (_) {
        window.showToast('Unable to reach authentication service', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Sign In to Admin Panel';
      }
    });
  </script>
</body>
</html>
